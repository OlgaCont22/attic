<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КОТЕЙКИН ЧЕРДАЧОК</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000;
            overflow: hidden;
        }

        .scene {
            position: relative;
            flex-shrink: 0;
        }

        #bgWrap {
            position: absolute;
            inset: 0;
        }

        .bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            transition: opacity 0.12s ease;
        }

        #bgOn { opacity: 0; }

        /* ========== КЛИКАБЕЛЬНЫЕ ОБЛАСТИ (ХОТСПОТЫ) ========== */
        .hotspot {
            position: absolute;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 20;
            box-sizing: border-box;
        }

        /* ========== ПОСТЕРЫ ========== */
        .poster {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top left;
            display: none;
            z-index: 25;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.12s ease;
            will-change: transform;
            box-shadow: 0 16px 48px rgba(0,0,0,0.85), 0 8px 24px rgba(0,0,0,0.7);
        }

        /* ========== ВЫКЛЮЧАТЕЛЬ (чистый CSS) ========== */
        .light-switch {
            position: absolute;
            right: 20px;
            bottom: 20px;
            width: 52px;
            height: 84px;
            border-radius: 10px;
            background: linear-gradient(145deg, #e8e4da, #b8b2a6);
            box-shadow: 0 3px 8px rgba(0,0,0,0.55), inset 0 1px 2px rgba(255,255,255,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 30;
            transition: box-shadow 0.2s ease, transform 0.1s ease;
        }
        .light-switch:hover {
            box-shadow: 0 3px 12px rgba(0,0,0,0.7), 0 0 12px rgba(255,220,120,0.35), inset 0 1px 2px rgba(255,255,255,0.5);
        }
        .light-switch:active { transform: scale(0.96); }
        .light-switch .rocker {
            width: 30px;
            height: 52px;
            border-radius: 6px;
            background: linear-gradient(#faf7f0, #cfc9bd);
            box-shadow: 0 3px 5px rgba(0,0,0,0.45), inset 0 -2px 3px rgba(0,0,0,0.15);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
            transform: perspective(160px) rotateX(22deg);
        }
        .light-switch.on .rocker {
            transform: perspective(160px) rotateX(-22deg);
            box-shadow: 0 -3px 5px rgba(0,0,0,0.35), inset 0 2px 3px rgba(0,0,0,0.12), 0 0 10px rgba(255,230,150,0.5);
        }

        /* ========== ЭКРАН ЗАГРУЗКИ ========== */
        #loadingScreen {
            position: fixed;
            inset: 0;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: default;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(255,255,255,0.15);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loadingText {
            color: #888;
            font-family: Arial, sans-serif;
            font-size: 24px;
            text-align: center;
            pointer-events: none;
            transition: color 0.3s ease;
        }
        #loadingText.ready {
            color: #fff;
            text-shadow: 0 0 10px #fff, 0 0 20px #fff;
        }
        #loadingScreen.ready { cursor: pointer; }
    </style>
</head>
<body>
    <div id="loadingScreen">
        <div class="spinner"></div>
        <div id="loadingText">ЗАГРУЗКА, ЖДИТЕ...</div>
    </div>

    <div class="scene" id="scene" style="display: none;">
        <div id="bgWrap">
            <img id="bgOff" class="bg" alt="">
            <img id="bgOn" class="bg" alt="">
        </div>
        <!-- Хотспоты и постеры добавляются сюда из JS -->
        <div id="lightSwitch" class="light-switch" role="button" aria-label="Выключатель света" title="Включить/выключить свет">
            <div class="rocker"></div>
        </div>
    </div>

    <script>
        const BG_OFF = './images/bgOff.jpg'; // свет выключен
        const BG_ON  = './images/bgOn.jpg'; // свет включён

        // ========== АУДИО ==========
        const AUDIO_URLS = {
            backgroundMusic: './sounds/attic-ambience.aac',
        };

        // ========== НАСТРАИВАЕМЫЕ КЛИКАБЕЛЬНЫЕ ОБЛАСТИ И ПОСТЕРЫ ==========
        // Каждая область — точка разворачивания постера. Области невидимые.
        //   left, top, width, height — позиция и размер области, px
        //   poster — ПОЛНАЯ ССЫЛКА на постер
        // Постеры распределены по областям 1–10 по порядку списка — при
        // необходимости поменяйте ссылки в поле poster нужных строк.
        const HOTSPOTS = [
            { id: 1, left: 35, top: 307,  width: 95, height: 230, poster: './images/RE_poster.JPG' },
            { id: 2, left: 344, top: 138, width: 88, height: 133, poster: './images/casino_poster.JPG' },
            { id: 3, left: 492, top: 136, width: 88, height: 133, poster: './images/hope_poster.JPG' },
            { id: 4, left: 645, top: 136, width: 88, height: 133, poster: './images/horse_poster.JPG' },
            { id: 5, left: 165, top: 300, width: 68, height: 180, poster: './images/vic_poster.JPG' },
            { id: 6, left: 348, top: 311, width: 65, height: 100, poster: './images/Onsl_poster.JPG' },
            { id: 7, left: 492, top: 309, width: 88, height: 133, poster: './images/wer_poster.jpg' },
            { id: 8, left: 645, top: 309, width: 88, height: 133, poster: './images/blade_poster.jpg' },
            { id: 9, left: 842, top: 300, width: 56, height: 180, poster: './images/terr_poster.jpg' },
            { id: 10, left: 930, top: 307, width: 90, height: 220, poster: './images/fall_poster.jpg' },
        ];

        // Максимальный размер развёрнутого постера (можно подкорректировать)
        const POSTER_MAX_W = 360;
        const POSTER_MAX_H = 460;

        // Яркость постера при ВЫКЛЮЧЕННОМ свете (1 = без затемнения).
        // Подкрутите под ваш тёмный фон, если постер слишком тёмный/светлый.
        const POSTER_DARK_BRIGHTNESS = 0.3;

        // Параметры мерцания при ВКЛЮЧЕНИИ света
        const FLICKER_ON = {
            duration: 1200,
            levels: [0.4, 0.7, 1.15, 0.6, 1.2, 0.9, 1],
            minGap: 40,
            maxGap: 180,
        };

        // Параметры фонового мерцания, когда свет стабильно горит
        const FLICKER_AMBIENT = {
            duration: 1000,
            levels: [0.9, 0.96, 1.05, 0.93, 1.03, 1],
            minGap: 40,
            maxGap: 180,
        };

        const AMBIENT_MIN_DELAY = 10000;
        const AMBIENT_MAX_DELAY = 20000;

        const state = {
            isLightOn: false,
            allAssetsLoaded: false,
            flickerGeneration: 0,
            ambientFlickerTimer: null,
            audioEnabled: false,
            audioElements: null,
            sceneW: 0,
            sceneH: 0,
            loadedPosters: [],
            posterById: {},
            currentExpandedPoster: null,
            isAnimating: false,
        };

        // ========== ЗАГРУЗКА ИЗОБРАЖЕНИЙ ==========
        function preloadImg(src) {
            return new Promise(resolve => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = src;
            });
        }

        function preloadPosters() {
            return Promise.all(HOTSPOTS.map(zone => {
                const src = zone.poster;
                return preloadImg(src).then(img => ({ zone, src, img }));
            }));
        }

        // ========== АУДИО ==========
        function initAudio() {
            state.audioElements = {
                backgroundMusic: new Audio(AUDIO_URLS.backgroundMusic),
            };
            state.audioElements.backgroundMusic.loop = true;
            state.audioElements.backgroundMusic.volume = 0.6;
        }

        function preloadAudio() {
            return new Promise(resolve => {
                initAudio();
                const elements = [state.audioElements.backgroundMusic];
                let loaded = 0;
                let settled = false;
                const total = elements.length;

                const finish = () => {
                    if (settled) return;
                    settled = true;
                    resolve();
                };

                if (total === 0) { finish(); return; }
                setTimeout(finish, 25000);

                elements.forEach(audio => {
                    audio.addEventListener('canplaythrough', () => {
                        if (settled) return;
                        loaded++;
                        if (loaded === total) finish();
                    }, { once: true });
                    audio.addEventListener('error', () => {
                        if (settled) return;
                        loaded++;
                        if (loaded === total) finish();
                    }, { once: true });
                    audio.load();
                });
            });
        }

        function tryPlayBackgroundMusic() {
            const music = state.audioElements && state.audioElements.backgroundMusic;
            if (!music) return;
            const promise = music.play();
            if (!promise || typeof promise.catch !== 'function') return;
            promise.catch(() => {
                const handleInteraction = () => music.play().catch(() => {});
                document.addEventListener('click', handleInteraction, { once: true });
                document.addEventListener('keydown', handleInteraction, { once: true });
            });
        }

        function applySceneSize(width, height) {
            const scene = document.getElementById('scene');
            scene.style.width = width + 'px';
            scene.style.height = height + 'px';
        }

        async function initialize() {
            const [bgImgs, loadedPosters] = await Promise.all([
                Promise.all([preloadImg(BG_OFF), preloadImg(BG_ON)]),
                preloadPosters(),
                preloadAudio(),
            ]);
            const offImg = bgImgs[0];

            const w = offImg ? offImg.naturalWidth : 1265;
            const h = offImg ? offImg.naturalHeight : 550;
            applySceneSize(w, h);

            state.sceneW = w;
            state.sceneH = h;
            state.loadedPosters = loadedPosters;

            document.getElementById('bgOff').src = BG_OFF;
            document.getElementById('bgOn').src = BG_ON;

            state.allAssetsLoaded = true;
            const loadingText = document.getElementById('loadingText');
            const loadingScreen = document.getElementById('loadingScreen');
            loadingText.firstChild.nodeValue = 'ЗАЛЕЗТЬ НА ЧЕРДАК';
            loadingText.classList.add('ready');
            loadingScreen.classList.add('ready');
            loadingScreen.addEventListener('click', enterScene);
        }

        function enterScene() {
            if (!state.allAssetsLoaded) return;
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('scene').style.display = 'block';
            createHotspots();
            createPosterElements();
            state.audioEnabled = true;
            tryPlayBackgroundMusic();
        }

        // ========== КЛИКАБЕЛЬНЫЕ ОБЛАСТИ ==========
        function createHotspots() {
            const scene = document.getElementById('scene');
            HOTSPOTS.forEach(zone => {
                const el = document.createElement('div');
                el.className = 'hotspot';
                el.dataset.id = zone.id;
                el.style.left = zone.left + 'px';
                el.style.top = zone.top + 'px';
                el.style.width = zone.width + 'px';
                el.style.height = zone.height + 'px';
                el.addEventListener('click', () => onHotspotClick(zone));
                scene.appendChild(el);
            });
        }

        function onHotspotClick(zone) {
            const zoneData = state.posterById[zone.id];
            if (!zoneData) return;
            if (state.currentExpandedPoster === zoneData) {
                collapsePoster();
                return;
            }
            expandPoster(zoneData);
        }

        // ========== ОСВЕЩЕНИЕ ПОСТЕРА ==========
        // Возвращает значение фильтра постера в зависимости от состояния света:
        // свет выкл — постер затемнён, свет вкл — обычная яркость.
        function getPosterFilter() {
            return state.isLightOn ? 'brightness(1)' : `brightness(${POSTER_DARK_BRIGHTNESS})`;
        }

        // Обновляет яркость текущего развёрнутого постера (например, при
        // переключении света, пока постер открыт).
        function updateExpandedPosterLighting() {
            if (state.currentExpandedPoster) {
                state.currentExpandedPoster.el.style.filter = getPosterFilter();
            }
        }

        // ========== ПОСТЕРЫ ==========
        function createPosterElements() {
            const scene = document.getElementById('scene');
            const maxW = Math.min(POSTER_MAX_W, state.sceneW * 0.5);
            const maxH = Math.min(POSTER_MAX_H, state.sceneH * 0.85);

            state.loadedPosters.forEach(p => {
                if (!p.img) return;
                const naturalW = p.img.naturalWidth || 300;
                const naturalH = p.img.naturalHeight || 420;
                const ratio = Math.min(maxW / naturalW, maxH / naturalH);
                const finalW = Math.round(naturalW * ratio);
                const finalH = Math.round(naturalH * ratio);

                const el = document.createElement('img');
                el.className = 'poster';
                el.src = p.src;
                el.style.width = finalW + 'px';
                el.style.height = finalH + 'px';
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    collapsePoster();
                });
                scene.appendChild(el);

                state.posterById[p.zone.id] = { zone: p.zone, el, finalW, finalH };
            });
        }

        function expandPoster(zoneData) {
            if (state.isAnimating) return;
            if (state.currentExpandedPoster) {
                collapsePoster(() => expandPoster(zoneData));
                return;
            }
            state.isAnimating = true;

            const poster = zoneData.el;
            const sx = zoneData.zone.width / zoneData.finalW;
            const sy = zoneData.zone.height / zoneData.finalH;
            const centerX = (state.sceneW - zoneData.finalW) / 2;
            const centerY = (state.sceneH - zoneData.finalH) / 2;

            poster.style.display = 'block';
            // Постер сразу получает яркость под текущее состояние света
            poster.style.filter = getPosterFilter();
            poster.style.transform = `translate(${zoneData.zone.left}px, ${zoneData.zone.top}px) scale(${sx}, ${sy})`;
            state.currentExpandedPoster = zoneData;

            requestAnimationFrame(() => {
                setTimeout(() => {
                    poster.style.transform = `translate(${centerX}px, ${centerY}px) scale(1, 1)`;
                    setTimeout(() => { state.isAnimating = false; }, 320);
                }, 20);
            });
        }

        function collapsePoster(callback) {
            if (!state.currentExpandedPoster || state.isAnimating) return;
            state.isAnimating = true;

            const zoneData = state.currentExpandedPoster;
            const poster = zoneData.el;
            const sx = zoneData.zone.width / zoneData.finalW;
            const sy = zoneData.zone.height / zoneData.finalH;

            poster.style.transform = `translate(${zoneData.zone.left}px, ${zoneData.zone.top}px) scale(${sx}, ${sy})`;

            setTimeout(() => {
                poster.style.display = 'none';
                state.currentExpandedPoster = null;
                state.isAnimating = false;
                if (typeof callback === 'function') callback();
            }, 320);
        }

        // Клик мимо постера/областей — свернуть текущий постер
        document.addEventListener('click', (e) => {
            if (!state.currentExpandedPoster) return;
            if (e.target.closest('.hotspot')) return;
            if (e.target.closest('.poster')) return;
            if (e.target.closest('.light-switch')) return;
            collapsePoster();
        });

        // ========== МЕРЦАНИЕ ==========
        function runFlicker(config) {
            const wrap = document.getElementById('bgWrap');
            const generation = ++state.flickerGeneration;
            const startTime = performance.now();

            function step() {
                if (generation !== state.flickerGeneration) return;
                const elapsed = performance.now() - startTime;
                if (elapsed >= config.duration) {
                    wrap.style.filter = 'brightness(1)';
                    return;
                }
                const level = config.levels[Math.floor(Math.random() * config.levels.length)];
                wrap.style.filter = `brightness(${level})`;
                setTimeout(step, config.minGap + Math.random() * (config.maxGap - config.minGap));
            }
            step();
        }

        function scheduleAmbientFlicker() {
            if (state.ambientFlickerTimer) {
                clearTimeout(state.ambientFlickerTimer);
                state.ambientFlickerTimer = null;
            }
            if (!state.isLightOn) return;

            const delay = AMBIENT_MIN_DELAY + Math.random() * (AMBIENT_MAX_DELAY - AMBIENT_MIN_DELAY);
            state.ambientFlickerTimer = setTimeout(() => {
                if (!state.isLightOn) return;
                runFlicker(FLICKER_AMBIENT);
                scheduleAmbientFlicker();
            }, delay);
        }

        function stopAmbientFlicker() {
            if (state.ambientFlickerTimer) {
                clearTimeout(state.ambientFlickerTimer);
                state.ambientFlickerTimer = null;
            }
            state.flickerGeneration++;
        }

        // ========== СВЕТ ==========
        function toggleLight() {
            const bgOff = document.getElementById('bgOff');
            const bgOn = document.getElementById('bgOn');
            const wrap = document.getElementById('bgWrap');
            const sw = document.getElementById('lightSwitch');

            if (state.isLightOn) {
                stopAmbientFlicker();
                wrap.style.filter = 'brightness(1)';
                bgOn.style.opacity = '0';
                bgOff.style.opacity = '1';
                sw.classList.remove('on');
                state.isLightOn = false;
            } else {
                bgOff.style.opacity = '0';
                bgOn.style.opacity = '1';
                sw.classList.add('on');
                state.isLightOn = true;
                runFlicker(FLICKER_ON);
                scheduleAmbientFlicker();
            }
            // Если в этот момент развёрнут постер — обновляем его яркость под свет
            updateExpandedPosterLighting();
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('lightSwitch').addEventListener('click', toggleLight);
        });

        initialize();
    </script>
</body>
</html>
