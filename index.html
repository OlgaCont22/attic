<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КОТЕЙКИН ЧЕРДАЧОК</title>

    <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
    
    <!-- Preload hints для критичных ресурсов -->
    <link rel="preload" as="image" href="https://raw.githubusercontent.com/OlgaCont22/VHS/refs/heads/main/images/catModGif.gif">
    <link rel="preload" as="image" href="./images/bgOff.jpg">
    <link rel="preload" as="image" href="./images/bgOn.jpg">

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000;
            overflow: hidden;
        }

        .scene {
            position: relative;
            flex-shrink: 0;
            overflow: hidden;
        }

        #bgWrap {
            position: absolute;
            inset: 0;
        }

        .bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            transition: opacity 0.12s ease;
        }

        #bgOn { opacity: 0; }

        /* ========== ФОНАРИК (в темноте) ========== */
        /* Копия освещённого фона, видимая только в круге вокруг курсора */
        #bgFlash {
            --fx: -9999px;
            --fy: -9999px;
            --fr: 150px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            -webkit-mask-image: radial-gradient(circle var(--fr) at var(--fx) var(--fy),
                #000 0%, rgba(0,0,0,0.85) 35%, rgba(0,0,0,0.35) 70%, transparent 100%);
                    mask-image: radial-gradient(circle var(--fr) at var(--fx) var(--fy),
                #000 0%, rgba(0,0,0,0.85) 35%, rgba(0,0,0,0.35) 70%, transparent 100%);
        }
        /* --fp — заряд батарейки 0..1 (задаётся из JS) */
        #bgFlash.active { opacity: calc(0.8 * var(--fp, 1)); }

        /* ========== ВИНЬЕТКА ========== */
        /* Затемнение углов: сильное в темноте, лёгкое при включённой лампе.
           Сила задаётся из JS (VIGNETTE_DARK / VIGNETTE_LIT) через opacity. */
        #vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 14; /* над фоном, фонариком и пылью; под глазами кошки */
            background: radial-gradient(ellipse 75% 80% at 50% 45%,
                transparent 40%, rgba(5, 3, 0, 0.6) 75%, rgb(5, 3, 0) 100%);
            transition: opacity 0.4s ease;
        }

        /* ========== ГЛАЗА КОШКИ В ТЕМНОТЕ ========== */
        #catEyes {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 15; /* над фоном и пылью, под хотспотами и постерами */
            --glow: 0;    /* яркость свечения 0..1 (задаётся из JS) */
            --slit: 35%;  /* ширина зрачка относительно глаза */
            --lx: 0;      /* направление взгляда -1..1 */
            --ly: 0;
        }
        .cat-eye { position: absolute; }
        .eye-glow {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            opacity: var(--glow);
            background: radial-gradient(ellipse at 45% 42%,
                #f6ffc2 0%, #c4f456 38%, #6fae22 72%, rgba(70, 110, 15, 0.6) 100%);
            box-shadow: 0 0 5px 1px rgba(200, 255, 100, 0.55),
                        0 0 14px 4px rgba(160, 230, 60, 0.22);
        }
        .pupil {
            position: absolute;
            left: 50%;
            top: 6%;
            height: 88%;
            width: var(--slit);
            border-radius: 50%;
            background: #0b1004;
            transform: translate(calc(-50% + var(--lx) * 1.5px), calc(var(--ly) * 0.8px));
        }

        /* ========== КОНУС СВЕТА ОТ ЛАМПЫ ========== */
        /* Внешний слой размывает края конуса; внутренний обрезан трапецией
           (clip-path задаётся из JS по LAMP_BEAM). Лежит внутри #bgWrap,
           поэтому мерцает вместе с лампой. */
        #lampBeam {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.35s ease;
            mix-blend-mode: screen;
            filter: blur(16px);
        }
        #lampBeamCone {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 45% 95% at var(--bx, 50%) 0%,
                    rgba(255, 230, 180, 0.85) 0%,
                    rgba(255, 225, 170, 0.38) 45%,
                    rgba(255, 215, 155, 0.10) 80%,
                    transparent 100%);
        }
        /* Мягкое сияние вокруг самой лампочки */
        #lampHalo {
            position: absolute;
            width: 120px;
            height: 120px;
            margin: -60px 0 0 -60px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 240, 200, 0.6) 0%,
                rgba(255, 225, 170, 0.18) 45%, transparent 70%);
        }

        /* ========== НИТЬ НАКАЛА (разогрев / остывание лампы) ========== */
        /* Оранжевое свечение спирали: видно в начале включения и
           ненадолго после выключения. Яркость задаётся из JS. */
        #filament {
            position: absolute;
            width: 90px;
            height: 90px;
            margin: -45px 0 0 -45px;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            mix-blend-mode: screen;
            background: radial-gradient(circle,
                rgba(255, 205, 130, 1) 0%,
                rgba(255, 145, 55, 0.75) 14%,
                rgba(230, 90, 20, 0.3) 35%,
                transparent 70%);
        }

        /* ========== ПЫЛЬ В СВЕТЕ ========== */
        #dust { pointer-events: none; }

        /* ========== ПАУТИНА ========== */
        #cobweb { pointer-events: none; }

        /* ========== КОШКА-ТЕНЬ ========== */
        #catShadow { pointer-events: none; }

        /* ========== МОТЫЛЁК ========== */
        #moth { pointer-events: none; }

        /* ========== СЛЕДЫ ЛАП ========== */
        #pawPrints { pointer-events: none; }

        /* ========== СВЕТЛЯЧКИ ========== */
        /* Вне #bgWrap и над виньеткой — чтобы углы их не гасили */
        #fireflies {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
        }

        /* ========== СВЕТ ИЗ ЩЕЛЕЙ В ПОЛУ ========== */
        #floorCracks { pointer-events: none; mix-blend-mode: screen; }

        /* ========== ПЫЛЬ ОТ ПОСТЕРА ========== */
        /* Над постером и бликом, чтобы облачко было видно и поверх бумаги */
        #posterDust {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 27;
        }

        /* ========== КЛИКАБЕЛЬНЫЕ ОБЛАСТИ (ХОТСПОТЫ) ========== */
        .hotspot {
            position: absolute;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 20;
            box-sizing: border-box;
        }

        /* ========== ПОСТЕРЫ ========== */
        .poster {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top left;
            display: none;
            z-index: 25;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.12s ease;
            will-change: transform;
            box-shadow: 0 16px 48px rgba(0,0,0,0.85), 0 8px 24px rgba(0,0,0,0.7);
        }

        .poster > img {
            display: block;
            width: 100%;
            height: 100%;
            user-select: none;
        }

        /* Слой «старой бумаги» поверх постера (рисунок задаётся из JS) */
        .poster-age {
            position: absolute;
            inset: 0;
            pointer-events: none;
            mix-blend-mode: multiply;
            /* Бумажное зерно: шум SVG feTurbulence */
            --paper-grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.45  0 0 0 0 0.33  0 0 0 0 0.18  0 0 0 0.3 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
            /* Потёртые края */
            box-shadow: inset 0 0 14px 2px rgba(90, 60, 25, 0.45);
        }

        /* Блик на глянцевом постере (наклон при наведении) */
        #posterGlare {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top left;
            display: none;
            z-index: 26;
            pointer-events: none;
            opacity: 0;
            mix-blend-mode: screen;
            --gx: 50%;
            --gy: 50%;
            background: radial-gradient(circle at var(--gx) var(--gy),
                rgba(255, 250, 235, 0.45) 0%, rgba(255, 250, 235, 0.12) 25%, transparent 55%);
            will-change: transform;
        }

        /* ========== ВЫКЛЮЧАТЕЛЬ-ШНУРОК ========== */
        .pull-cord {
            position: absolute;
            cursor: pointer;
            z-index: 30;
            user-select: none;
            -webkit-user-drag: none;
            --light: 0.3;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)) brightness(var(--light));
            transition: filter 0.15s ease;
        }

        /* ========== ЭКРАН ЗАГРУЗКИ ========== */
        #loadingScreen {
            position: fixed;
            inset: 0;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: default;
        }
        #loadingGif {
            margin-bottom: 20px;
            max-width: 200px;
            height: auto;
        }
        #loadingText {
            color: #888;
            font-family: Arial, sans-serif;
            font-size: 24px;
            text-align: center;
            pointer-events: none;
            transition: color 0.3s ease;
        }
        #loadingText.ready {
            color: #fff;
            text-shadow: 0 0 10px #fff, 0 0 20px #fff;
        }
        #loadingScreen.ready { cursor: pointer; }
    </style>
</head>
<body>
    <div id="loadingScreen">
        <img id="loadingGif" src="https://raw.githubusercontent.com/OlgaCont22/VHS/refs/heads/main/images/catModGif.gif" alt="Loading">
        <div id="loadingText">ЗАГРУЗКА, ЖДИТЕ...</div>
    </div>

    <div class="scene" id="scene" style="display: none;">
        <div id="bgWrap">
            <img id="bgOff" class="bg" alt="">
            <img id="bgOn" class="bg" alt="">
            <img id="bgFlash" class="bg" alt="">
            <canvas id="floorCracks" class="bg"></canvas>
            <div id="lampBeam"><div id="lampBeamCone"></div><div id="lampHalo"></div></div>
            <div id="filament"></div>
            <canvas id="pawPrints" class="bg"></canvas>
            <canvas id="catShadow" class="bg"></canvas>
            <canvas id="cobweb" class="bg"></canvas>
            <canvas id="dust" class="bg"></canvas>
            <canvas id="moth" class="bg"></canvas>
        </div>
        <div id="vignette"></div>
        <canvas id="fireflies"></canvas>
        <!-- Хотспоты и постеры добавляются сюда из JS -->
        <img id="pullCord" class="pull-cord" alt="Выключатель-шнурок">
    </div>

    <script>
        const BG_OFF = './images/bgOff.jpg'; // свет выключен
        const BG_ON  = './images/bgOn.jpg'; // свет включён

        // ========== ВЫКЛЮЧАТЕЛЬ-ШНУРОК ==========
        const PULL_CORD_URL = './images/cord.png';
        const CORD_HEIGHT = 240;
        const CORD_RIGHT = 26;

        // ========== АУДИО ==========
        const AUDIO_URLS = {
            // Фоновая музыка: один из двух файлов выбирается случайно при открытии страницы
            backgroundMusicOptions: [
                './sounds/attic-ambience.aac',
                './sounds/attic-ambience2.aac',
            ],
            switchSound: './sounds/light.mp3',
            posterUnfoldSound: './sounds/poster_unf.mp3',
            posterFoldSound: './sounds/poster_f.mp3',
            catPurr: './sounds/murr.mp3',
            // Звуки лампы: один из трёх играет случайным образом при включении света и при мерцании
            lampSounds: [
                './sounds/lamp1.mp3',
                './sounds/lamp2.mp3',
                './sounds/lamp3.mp3',
            ],
        };

        // Интервал между воспроизведениями мурчания: 15–30 секунд
        const CAT_PURR_MIN_DELAY = 15000;
        const CAT_PURR_MAX_DELAY = 30000;

        // ========== НАСТРАИВАЕМЫЕ КЛИКАБЕЛЬНЫЕ ОБЛАСТИ И ПОСТЕРЫ ==========
        // Каждая область — точка разворачивания постера. Области невидимые.
        //   left, top, width, height — позиция и размер области, px
        //   poster — ПОЛНАЯ ССЫЛКА на постер
        // Постеры распределены по областям 1–10 по порядку списка — при
        // необходимости поменяйте ссылки в поле poster нужных строк.
        const HOTSPOTS = [
            { id: 1, left: 35, top: 307,  width: 95, height: 230, poster: './images/motor_poster.jpg' },
            { id: 2, left: 344, top: 138, width: 88, height: 133, poster: './images/casino_poster.JPG' },
            { id: 3, left: 492, top: 136, width: 88, height: 133, poster: './images/wicker_poster.JPG' },
            { id: 4, left: 645, top: 136, width: 88, height: 133, poster: './images/horse_poster.JPG' },
            { id: 5, left: 165, top: 300, width: 68, height: 180, poster: './images/vic_poster.JPG' },
            { id: 6, left: 348, top: 311, width: 65, height: 100, poster: './images/Onsl_poster.JPG' },
            { id: 7, left: 492, top: 309, width: 88, height: 133, poster: './images/wer_poster.jpg' },
            { id: 8, left: 645, top: 309, width: 88, height: 133, poster: './images/blade_poster.jpg' },
            { id: 9, left: 842, top: 300, width: 56, height: 180, poster: './images/terr_poster.jpg' },
            { id: 10, left: 930, top: 307, width: 90, height: 220, poster: './images/tigr_poster.jpg' },
        ];

        // Максимальный размер развёрнутого постера (можно подкорректировать)
        const POSTER_MAX_W = 360;
        const POSTER_MAX_H = 460;

        // Яркость постеров и шнурка при ВЫКЛЮЧЕННОМ свете (1 = без затемнения)
        const POSTER_DARK_BRIGHTNESS = 0.3;

        // Единый эффект НЕБОЛЬШОГО мерцания: используется и при включении света,
        // и для случайных мерцаний уже включённого света.
        const FLICKER_AMBIENT = {
            duration: 1000,
            levels: [0.9, 0.96, 1.05, 0.93, 1.03, 1],
            minGap: 40,
            maxGap: 180,
        };

        // Фонарик в темноте: true — включён, false — полностью отключён
        const FLASHLIGHT_ENABLED = true;
        // Фонарик в темноте: радиус светового круга, px
        const FLASHLIGHT_RADIUS = 200;
        // Амплитуда дрожания фонарика, px (0 — без дрожания)
        const FLASHLIGHT_SHAKE = 3;
        // Тёплый оттенок луча, как у лампы накаливания: 0 — без оттенка, 1 — сильный
        const FLASHLIGHT_TINT = 0.7;
        // Садится батарейка: иногда луч мигает и тускнеет, пока фонарик не потрясти
        // (быстро поводить курсором / пальцем туда-сюда)
        const FLASHLIGHT_BATTERY_ENABLED = true;
        const FLASHLIGHT_BATTERY_MIN_DELAY = 30000; // через сколько мс работы фонарика (30–70 с)
        const FLASHLIGHT_BATTERY_MAX_DELAY = 70000;
        const FLASHLIGHT_BATTERY_AUTO_RECOVER = 12000; // не потрясли — сам оживёт через столько мс

        // ========== ВИНЬЕТКА ==========
        // Затемнение углов: 0 — нет, 1 — максимум
        const VIGNETTE_DARK = 0.85; // свет выключен
        const VIGNETTE_LIT = 0.35;  // свет включён

        // ========== КОНУС СВЕТА ОТ ЛАМПЫ ==========
        // Мягкий видимый луч под лампочкой при включённом свете; пыль в нём ярче
        const LAMP_BEAM_ENABLED = true;
        const LAMP_BEAM = {
            x: 546,          // центр лампочки по X, px (в координатах фона)
            y: 88,           // откуда начинается конус (низ лампочки), px
            topWidth: 26,    // ширина конуса у лампочки, px
            bottomWidth: 680,// ширина конуса у нижнего края сцены, px
            strength: 0.7,   // яркость луча: 0 — не виден, 1 — максимум
        };
        // Насколько видна пыль ВНЕ конуса при включённом свете (1 — как в конусе)
        const LAMP_BEAM_DUST_OUTSIDE = 0.35;

        // ========== РАЗОГРЕВ ЛАМПЫ ==========
        // Включение как у лампы накаливания: сначала оранжевая спираль,
        // потом тёплый тусклый свет разгорается до обычного.
        // Выключение: комната гаснет сразу, спираль ещё мгновение тлеет.
        const LAMP_WARMUP_ENABLED = true;
        const LAMP_WARMUP_MS = 300;        // длительность разогрева, мс
        const LAMP_AFTERGLOW_MS = 150;     // остывание спирали после выключения, мс
        const LAMP_STUBBORN_CHANCE = 0.12; // шанс, что лампа «не схватится» с первого раза (0 — никогда)

        // ========== ПАУТИНА ==========
        // Паутина в углах: колышется от сквозняка и от движения курсора рядом.
        // При свете видна всегда, в темноте — только в луче фонарика.
        const COBWEB_ENABLED = true;
        const COBWEB_OPACITY = 0.5; // насколько заметна при свете (0..1)
        //   x, y — точка крепления (угол), r — размер, from/to — сектор, градусы
        //   (0° — вправо, 90° — вниз)
        const COBWEBS = [
            { x: 428, y: 52, r: 85,  from: 6, to: 126 }, // угол балки и левого стропила
            { x: 0,   y: 0,  r: 165, from: 2, to: 88 },  // левый верхний угол
        ];

        // ========== КОШКА-ТЕНЬ ==========
        // В темноте иногда вдоль стены пробегает силуэт кошки. Попала в луч
        // фонарика — замирает, глаза вспыхивают, и она убегает.
        const CAT_SHADOW_ENABLED = true;
        const CAT_SHADOW_FIRST_DELAY = 15000; // первое появление: через столько мс темноты
        const CAT_SHADOW_MIN_DELAY = 40000;   // следующие: через 40–90 с темноты
        const CAT_SHADOW_MAX_DELAY = 90000;
        const CAT_SHADOW_OPACITY = 0.6;       // насколько тёмный силуэт (0..1)
        // Путь: линия пола у задней стены, между стопками постеров
        const CAT_SHADOW_PATH = { y: 471, leftX: 245, rightX: 835, speed: 70, scale: 1 };
        const CAT_SHADOW_RUN_SPEEDUP = 4;  // во сколько раз быстрее убегает
        const CAT_STRIDE_WALK = 12;   // вынос лапы от плеча/бедра при ходьбе, px
        const CAT_STRIDE_RUN = 16;    // и на галопе
        const CAT_DUTY_WALK = 0.62;   // доля цикла, когда лапа на полу (шаг)
        const CAT_DUTY_RUN = 0.4;     // (галоп)
        // Контуры, за которыми силуэт прячется (настоящая кошка на переднем плане).
        // Обведено по фону: спина, пушистая грудь, голова, уши.
        const CAT_SHADOW_HIDE = [[
            [300, 614], [304, 490], [309, 475], [315, 465], [320, 455], [326, 446], [330, 438], [340, 428],
            [360, 415], [385, 400], [405, 385], [412, 360], [418, 334],  // спина → левое ухо
            [432, 342], [452, 350], [470, 342], [484, 331],                // между ушами → правое ухо
            [487, 360], [490, 380], [492, 396], [486, 410], [480, 425],    // морда, подбородок
            [486, 445], [492, 470], [495, 614],                             // грудь
        ]];

        // ========== СВЕТ ИЗ ЩЕЛЕЙ В ПОЛУ ==========
        // В темноте сквозь щели между досками пробивается тёплый свет из
        // комнаты внизу: чуть дрожит, а иногда по нему проходит тень —
        // кто-то ходит внизу. При включённой лампе щели гаснут.
        const FLOOR_CRACKS_ENABLED = true;
        const FLOOR_CRACK_STRENGTH = 0.25;  // яркость в темноте (0..1)
        const FLOOR_CRACK_LIT = 0;         // яркость при включённой лампе (0 — не видно)
        const FLOOR_CRACKS = {
            vpX: 550, vpY: 270,            // точка схода досок (перспектива)
            topY: 472, bottomY: 614,       // от стены до нижнего края сцены
            // Щели: X у нижнего края сцены (по швам между досками на фоне)
            xs: [120, 190, 250, 527, 578, 640, 700, 761, 831, 895, 960],
        };
        // Видимая часть пола (без стопок постеров по бокам)
        const FLOOR_AREA = [
            [245, 472], [832, 472], [888, 522], [905, 560], [1000, 600], [1010, 614],

        // ========== СВЕТЛЯЧКИ ==========
        // Через несколько секунд темноты по чердаку начинают плавать

        const PAW_PRINTS_ENABLED = true;

        // ========== МОТЫЛЁК ==========
        // При включённой лампе вокруг лампочки петляет мотылёк и иногда

        const MOTH_RETURN_DELAY = [1500, 4000];    // через сколько мс после включения света прилетает к лампе
        const MOTH_BEAM_CHANCE = 0.6;              // шанс, что в темноте заинтересуется фонариком (0 — никогда)

        // ========== СТАРАЯ БУМАГА ==========

        // Центры глаз на фоне (px, в координатах фона), размер и наклон

        const AMBIENT_MIN_DELAY = 10000;

        const state = {

        // ========== ЗАГРУЗКА ИЗОБРАЖЕНИЙ ==========
        function preloadImg(src) {
            return new Promise(resolve => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = src;
            });
        }

        function preloadPosters() {
            return Promise.all(HOTSPOTS.map(zone => {
                const src = zone.poster;
                return preloadImg(src).then(img => ({ zone, src, img }));
            }));
        }

        // ========== АУДИО ==========
        function initAudio() {
            // Случайным образом выбираем один из двух фоновых треков
            const options = AUDIO_URLS.backgroundMusicOptions;
            const selectedUrl = options[Math.floor(Math.random() * options.length)];
            state.selectedBackgroundMusicUrl = selectedUrl;

            state.audioElements = {
                backgroundMusic: new Audio(selectedUrl),
                switchSound: new Audio(AUDIO_URLS.switchSound),
                posterUnfoldSound: new Audio(AUDIO_URLS.posterUnfoldSound),
                posterFoldSound: new Audio(AUDIO_URLS.posterFoldSound),
                catPurr: new Audio(AUDIO_URLS.catPurr),
                lampSounds: AUDIO_URLS.lampSounds.map(url => new Audio(url)),
            };
            state.audioElements.backgroundMusic.loop = true;
            state.audioElements.backgroundMusic.volume = 0.6;
        }

        function preloadAudio() {
            return new Promise(resolve => {
                initAudio();
                const elements = [
                    state.audioElements.backgroundMusic,
                    state.audioElements.switchSound,
                    state.audioElements.posterUnfoldSound,
                    state.audioElements.posterFoldSound,
                    state.audioElements.catPurr,
                    ...state.audioElements.lampSounds,
                ];
                let loaded = 0;
                let settled = false;
                const total = elements.length;

                const finish = () => {
                    if (settled) return;
                    settled = true;
                    resolve();
                };

                if (total === 0) { finish(); return; }
                setTimeout(finish, 25000);

                elements.forEach(audio => {
                    audio.addEventListener('canplaythrough', () => {
                        if (settled) return;
                        loaded++;
                        if (loaded === total) finish();
                    }, { once: true });
                    audio.addEventListener('error', () => {
                        if (settled) return;
                        loaded++;
                        if (loaded === total) finish();
                    }, { once: true });
                    audio.load();
                });
            });
        }

        function tryPlayBackgroundMusic() {
            const music = state.audioElements && state.audioElements.backgroundMusic;
            if (!music) return;
            const promise = music.play();
            if (!promise || typeof promise.catch !== 'function') return;
            promise.catch(() => {
                const handleInteraction = () => music.play().catch(() => {});
                document.addEventListener('click', handleInteraction, { once: true });
                document.addEventListener('keydown', handleInteraction, { once: true });
            });
        }

        function playSwitchSound() {
            if (!state.audioEnabled || !state.audioElements) return;
            const s = state.audioElements.switchSound;
            if (!s) return;
            s.currentTime = 0;
            s.play().catch(() => {});
        }

        // Звук РАЗВОРАЧИВАНИЯ постера
        function playPosterUnfoldSound() {
            if (!state.audioEnabled || !state.audioElements) return;
            const s = state.audioElements.posterUnfoldSound;
            if (!s) return;
            s.currentTime = 0;
            s.play().catch(() => {});
        }

        // Звук СВОРАЧИВАНИЯ постера
        function playPosterFoldSound() {
            if (!state.audioEnabled || !state.audioElements) return;
            const s = state.audioElements.posterFoldSound;
            if (!s) return;
            s.currentTime = 0;
            s.play().catch(() => {});
        }
        // Случайный звук ЛАМПЫ (один из трёх) — при включении света и при мерцании
        function playRandomLampSound() {
            if (!state.audioEnabled || !state.audioElements) return;
            const sounds = state.audioElements.lampSounds;
            if (!sounds || sounds.length === 0) return;
            const s = sounds[Math.floor(Math.random() * sounds.length)];
            if (!s) return;
            s.currentTime = 0;
            s.play().catch(() => {});
        }
        // ========== МУРЧАНИЕ КОШКИ ==========
        // Планирует следующее мурчание через случайные 15–30 секунд.
        function scheduleNextPurr() {
            if (state.catPurrTimer) clearTimeout(state.catPurrTimer);
            const delay = CAT_PURR_MIN_DELAY + Math.random() * (CAT_PURR_MAX_DELAY - CAT_PURR_MIN_DELAY);
            state.catPurrTimer = setTimeout(() => playCatPurr(), delay);
        }

        function playCatPurr() {
            if (!state.audioEnabled || !state.audioElements) return;
            const purr = state.audioElements.catPurr;
            if (!purr) return;
            purr.currentTime = 0;
            const promise = purr.play();
            if (promise && typeof promise.catch === 'function') {
                promise.catch(() => {
                    // Если воспроизведение не стартовало (например, заблокировано
                    // автоплей-политикой) — планируем следующую попытку, чтобы цикл не прерывался
                    scheduleNextPurr();
                });
            }
        }

        // Запускает цикл мурчания. Следующее воспроизведение планируется ТОЛЬКО
        // после того, как текущее доиграло до конца (событие 'ended').
        function startCatPurrCycle() {
            if (state.catPurrCycleStarted) return;
            const purr = state.audioElements && state.audioElements.catPurr;
            if (!purr) return;
            state.catPurrCycleStarted = true;
            purr.addEventListener('ended', () => scheduleNextPurr());
            scheduleNextPurr(); // первое мурчание — после стартовой случайной паузы
        }

        function applySceneSize(width, height) {
            const scene = document.getElementById('scene');
            scene.style.width = width + 'px';
            scene.style.height = height + 'px';
        }

        async function initialize() {
            const [bgImgs, loadedPosters, , cordImg] = await Promise.all([
                Promise.all([preloadImg(BG_OFF), preloadImg(BG_ON)]),
                preloadPosters(),
                preloadAudio(),
                preloadImg(PULL_CORD_URL),
            ]);
            const offImg = bgImgs[0];

            const w = offImg ? offImg.naturalWidth : 1265;
            const h = offImg ? offImg.naturalHeight : 550;
            applySceneSize(w, h);

            state.sceneW = w;
            state.sceneH = h;
            state.loadedPosters = loadedPosters;
            state.cordImg = cordImg;

            document.getElementById('bgOff').src = BG_OFF;
            document.getElementById('bgOn').src = BG_ON;
            document.getElementById('bgFlash').src = BG_ON;

            state.allAssetsLoaded = true;

            const loadingScreen = document.getElementById('loadingScreen');
            loadingText.firstChild.nodeValue = 'ЗАЛЕЗТЬ НА ЧЕРДАК';
            loadingText.classList.add('ready');
            loadingScreen.classList.add('ready');

        function enterScene() {
            if (!state.allAssetsLoaded) return;
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('scene').style.display = 'block';
            setupPullCord();
            setupFlashlight();

            setupPawPrints();
            setupCatShadow();
            setupDust();
            setupMoth();
            setupFireflies();
            setupCatEyes();
            updateVignette();
            setupPosterTilt();
            createHotspots();
            createPosterElements();

            tryPlayBackgroundMusic();

        }

        // ========== ВЫКЛЮЧАТЕЛЬ-ШНУРОК ==========
        function setupPullCord() {
            const cord = document.getElementById('pullCord');
            if (!cord) return;
            cord.src = PULL_CORD_URL;

            const img = state.cordImg;
            const naturalW = img ? img.naturalWidth : 60;
            const naturalH = img ? img.naturalHeight : CORD_HEIGHT;
            const ratio = naturalW / naturalH;

            const height = CORD_HEIGHT;
            const width = Math.round(height * ratio);

            cord.style.width = width + 'px';
            cord.style.height = height + 'px';
            cord.style.right = CORD_RIGHT + 'px';
            cord.style.top = Math.round(-height / 3) + 'px';

            updateCordLighting();
        }

        function updateCordLighting() {
            const cord = document.getElementById('pullCord');
            if (!cord) return;
            const light = state.isLightOn ? 1 : POSTER_DARK_BRIGHTNESS;
            cord.style.setProperty('--light', String(light));
        }

        function playCordAnimation() {
            const cord = document.getElementById('pullCord');
            if (!cord || typeof cord.animate !== 'function') return;

            const h = cord.offsetHeight || CORD_HEIGHT;
            const pull = Math.round(h * 0.24);

            const keyframes = [
                { transform: 'translateY(0px)', easing: 'cubic-bezier(0.55, 0, 1, 0.45)' },
                { transform: `translateY(${pull}px)`, offset: 0.16, easing: 'cubic-bezier(0, 0.4, 0.5, 1)' },
                { transform: `translateY(${Math.round(-pull * 0.10)}px)`, offset: 0.40, easing: 'ease-in-out' },
                { transform: `translateY(${Math.round(pull * 0.16)}px)`, offset: 0.58, easing: 'ease-in-out' },
                { transform: `translateY(${Math.round(-pull * 0.05)}px)`, offset: 0.74, easing: 'ease-in-out' },
                { transform: `translateY(${Math.round(pull * 0.06)}px)`, offset: 0.87, easing: 'ease-out' },
                { transform: 'translateY(0px)' }
            ];

            cord.animate(keyframes, { duration: 475 });
        }

        // ========== ФОНАРИК ==========
        // В темноте круг вокруг курсора (или пальца) показывает освещённый фон.
        function setupFlashlight() {
            const scene = document.getElementById('scene');
            const flash = document.getElementById('bgFlash');
            if (!FLASHLIGHT_ENABLED) {
                flash.remove(); // не держим лишний слой и не запускаем цикл анимации
                return;
            }
            flash.style.setProperty('--fr', FLASHLIGHT_RADIUS + 'px');
            if (FLASHLIGHT_TINT > 0) {
                const k = FLASHLIGHT_TINT;
                flash.style.filter = `sepia(${0.45 * k}) saturate(${1 + 0.35 * k}) ` +
                    `hue-rotate(${-6 * k}deg) brightness(${1 + 0.06 * k})`;
            }

            let pos = { x: 0, y: 0 };
            // Случайные фазы, чтобы дрожание не выглядело одинаковым при каждом заходе
            const ph = Array.from({ length: 5 }, () => Math.random() * Math.PI * 2);

            // ---- Батарейка ----
            // ok → stutter (мигает) → dim (тусклый) → revive (встряхнули: мигнул и ожил) → ok
            const rand = (a, b) => a + Math.random() * (b - a);
            const batt = {
                mode: 'ok', power: 1, usage: 0, modeT: 0, flickT: 0, dimLevel: 0.25,
                nextAt: rand(FLASHLIGHT_BATTERY_MIN_DELAY, FLASHLIGHT_BATTERY_MAX_DELAY) / 1000,
                reversals: [], lastSx: 0, lastSy: 0,
            };
            const revive = () => {
                if (batt.mode !== 'stutter' && batt.mode !== 'dim') return;
                batt.mode = 'revive';
                batt.modeT = 0.35;
            };
            // Встряска: 3+ резкие смены направления за 0,6 с
            const trackShake = (dx, dy, now) => {
                if (batt.mode !== 'stutter' && batt.mode !== 'dim') return;
                const check = (d, key) => {
                    if (Math.abs(d) < 4) return;
                    if (batt[key] && Math.sign(d) !== Math.sign(batt[key])) batt.reversals.push(now);
                    batt[key] = d;
                };
                check(dx, 'lastSx');
                check(dy, 'lastSy');
                batt.reversals = batt.reversals.filter(r => now - r < 600);
                if (batt.reversals.length >= 3) { batt.reversals = []; revive(); }
            };
            const updateBattery = (dt) => {
                if (!FLASHLIGHT_BATTERY_ENABLED) return;
                const b = batt;
                if (b.mode === 'ok') {
                    b.usage += dt;
                    if (b.usage >= b.nextAt) {
                        b.mode = 'stutter';
                        b.modeT = rand(0.6, 1.2);
                        b.dimLevel = rand(0.15, 0.3);
                    }
                } else if (b.mode === 'stutter') {
                    b.modeT -= dt;
                    b.flickT -= dt;
                    if (b.flickT <= 0) {
                        b.power = Math.random() < 0.5 ? rand(0.05, 0.4) : rand(0.7, 1);
                        b.flickT = rand(0.03, 0.12);
                    }
                    if (b.modeT <= 0) { b.mode = 'dim'; b.modeT = FLASHLIGHT_BATTERY_AUTO_RECOVER / 1000; }
                } else if (b.mode === 'dim') {
                    b.modeT -= dt;
                    // Тусклый, с редкими провалами
                    b.power = Math.random() < dt * 1.2 ? 0.04 : b.dimLevel * rand(0.85, 1.1);
                    if (b.modeT <= 0) revive();
                } else if (b.mode === 'revive') {
                    b.modeT -= dt;
                    b.power = Math.random() < 0.5 ? rand(0.3, 0.6) : 1;
                    if (b.modeT <= 0) {
                        b.mode = 'ok';
                        b.power = 1;
                        b.usage = 0;
                        b.nextAt = rand(FLASHLIGHT_BATTERY_MIN_DELAY, FLASHLIGHT_BATTERY_MAX_DELAY) / 1000;
                    }
                }
                flash.style.setProperty('--fp', b.power.toFixed(3));
                // Во время мигания — резкие переключения вместо плавного перехода
                flash.style.transition = b.mode === 'ok' ? '' : 'opacity 0.04s linear';
            };
            window.flashlightBattery = () => { batt.usage = batt.nextAt; }; // проверка в консоли

            // Постоянный цикл: позиция курсора + лёгкое «дрожание руки»
            // (сумма медленных синусоид) + едва заметная пульсация радиуса.
            let lastTick = performance.now();
            const tick = (now) => {
                requestAnimationFrame(tick);
                const dt = Math.min((now - lastTick) / 1000, 0.05);
                lastTick = now;
                if (!flash.classList.contains('active')) return;
                updateBattery(dt);
                const t = now / 1000;
                const a = FLASHLIGHT_SHAKE;
                const dx = a * (Math.sin(t * 7.3 + ph[0]) * 0.6 + Math.sin(t * 13.1 + ph[1]) * 0.4);
                const dy = a * (Math.sin(t * 6.1 + ph[2]) * 0.6 + Math.sin(t * 11.7 + ph[3]) * 0.4);
                // Слабая батарейка — луч не только тусклее, но и уже
                // (через радиус это чувствуют пыль, глаза кошки, светлячки и т. д.)
                const r = FLASHLIGHT_RADIUS * (1 + 0.02 * Math.sin(t * 9.4 + ph[4]))
                    * (0.6 + 0.4 * batt.power);
                flash.style.setProperty('--fx', (pos.x + dx).toFixed(1) + 'px');
                flash.style.setProperty('--fy', (pos.y + dy).toFixed(1) + 'px');
                flash.style.setProperty('--fr', r.toFixed(1) + 'px');
                // Позиция луча нужна пыли, чтобы в темноте она была видна только в нём
                state.flashBeam.x = pos.x + dx;
                state.flashBeam.y = pos.y + dy;
                state.flashBeam.r = r;
            };
            requestAnimationFrame(tick);

            const move = (e) => {
                const rect = scene.getBoundingClientRect();
                // Учитываем возможное масштабирование сцены
                const kx = state.sceneW / rect.width;
                const ky = state.sceneH / rect.height;
                const nx = (e.clientX - rect.left) * kx, ny = (e.clientY - rect.top) * ky;
                trackShake(nx - pos.x, ny - pos.y, performance.now());
                pos = { x: nx, y: ny };
                updateFlashlight(true);
            };

            scene.addEventListener('pointermove', move);
            scene.addEventListener('pointerdown', move);
            scene.addEventListener('pointerleave', () => updateFlashlight(false));
        }

        function updateFlashlight(pointerInside) {
            const flash = document.getElementById('bgFlash');
            if (!flash) return;
            if (typeof pointerInside === 'boolean') state.flashPointerInside = pointerInside;
            flash.classList.toggle('active', !state.isLightOn && !!state.flashPointerInside);
        }

        // ========== ПЫЛЬ В СВЕТЕ ==========
        // Пылинки медленно парят по чердаку. При включённой лампе видны везде,
        // в темноте — только внутри луча фонарика. Холст лежит внутри #bgWrap,
        // поэтому мерцание лампы действует и на пыль.
        function setupDust() {
            const canvas = document.getElementById('dust');
            if (!canvas || !canvas.getContext) return;
            const ctx = canvas.getContext('2d');
            const W = state.sceneW, H = state.sceneH;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const rand = (a, b) => a + Math.random() * (b - a);
            const particles = Array.from({ length: DUST_COUNT }, () => ({
                x: rand(0, W),
                y: rand(0, H),
                vx: rand(-1, 1) * DUST_SPEED,
                vy: rand(-1, 1) * DUST_SPEED * 0.6,
                size: Math.random() < 0.85 ? rand(0.5, 1.4) : rand(1.6, 2.6), // редкие крупные
                alpha: rand(0.25, 0.75),
                tw: rand(0.5, 1.6),           // скорость мерцания пылинки
                ph: rand(0, Math.PI * 2),
            }));

            let lightMix = state.isLightOn ? 1 : 0; // плавный переход вкл/выкл
            let last = performance.now();

            const frame = (now) => {
                requestAnimationFrame(frame);
                const dt = Math.min((now - last) / 1000, 0.05);
                last = now;
                const t = now / 1000;

                lightMix += (roomLightLevel() - lightMix) * Math.min(1, Math.max(0, dt) * 4);
                if (!Number.isFinite(lightMix)) lightMix = roomLightLevel();
                const beamOn = FLASHLIGHT_ENABLED && !state.isLightOn && state.flashPointerInside;
                ctx.clearRect(0, 0, W, H);
                if (lightMix < 0.01 && !beamOn) return;

                const b = state.flashBeam;
                for (const p of particles) {
                    // Броуновское блуждание + лёгкий восходящий поток тёплого воздуха
                    p.vx += rand(-1, 1) * DUST_SPEED * dt * 2;
                    p.vy += (rand(-1, 1) * DUST_SPEED * 2 - DUST_SPEED * 0.15) * dt;
                    p.vx *= 1 - dt * 0.5;
                    p.vy *= 1 - dt * 0.5;
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    if (p.x < -5) p.x = W + 5; else if (p.x > W + 5) p.x = -5;
                    if (p.y < -5) p.y = H + 5; else if (p.y > H + 5) p.y = -5;

                    // Видимость: свет лампы (ярче внутри конуса света от лампы)
                    // или близость к центру луча фонарика
                    let vis = lightMix;
                    if (vis > 0 && LAMP_BEAM_ENABLED) {
                        vis *= LAMP_BEAM_DUST_OUTSIDE + (1 - LAMP_BEAM_DUST_OUTSIDE) * lampBeamFactor(p.x, p.y);
                    }
                    if (beamOn) {
                        const d = Math.hypot(p.x - b.x, p.y - b.y) / b.r;
                        if (d < 1) vis = Math.max(vis, (1 - d * d) * 1.3);
                    }
                    if (vis <= 0.01) continue;

                    const twinkle = 0.6 + 0.4 * Math.sin(t * p.tw + p.ph);
                    ctx.globalAlpha = Math.min(1, p.alpha * twinkle * vis);
                    ctx.fillStyle = '#fff3dc';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            };
            requestAnimationFrame(frame);
        }

        // ========== ГЛАЗА КОШКИ В ТЕМНОТЕ ==========
        // В темноте глаза кошки слабо светятся, моргают и следят за курсором.
        // Если на них попадает луч фонарика — вспыхивают ярче, а зрачки
        // сужаются в щёлочки. При включённой лампе глаза не видны.
        function setupCatEyes() {
            if (!CAT_EYES_ENABLED) return;
            const scene = document.getElementById('scene');

            const wrap = document.createElement('div');
            wrap.id = 'catEyes';
            const glows = CAT_EYES.map(cfg => {
                const eye = document.createElement('div');
                eye.className = 'cat-eye';
                eye.style.left = (cfg.x - cfg.w / 2) + 'px';
                eye.style.top = (cfg.y - cfg.h / 2) + 'px';
                eye.style.width = cfg.w + 'px';
                eye.style.height = cfg.h + 'px';
                eye.style.transform = `rotate(${cfg.rot}deg)`;
                const glow = document.createElement('div');
                glow.className = 'eye-glow';
                const pupil = document.createElement('div');
                pupil.className = 'pupil';
                glow.appendChild(pupil);
                eye.appendChild(glow);
                wrap.appendChild(eye);
                return glow;
            });
            scene.appendChild(wrap);

            // Точка между глазами — от неё считаем взгляд и попадание луча
            const cx = CAT_EYES.reduce((s, e) => s + e.x, 0) / CAT_EYES.length;
            const cy = CAT_EYES.reduce((s, e) => s + e.y, 0) / CAT_EYES.length;

            let cursor = null;
            scene.addEventListener('pointermove', (e) => {
                const rect = scene.getBoundingClientRect();
                cursor = {
                    x: (e.clientX - rect.left) * state.sceneW / rect.width,
                    y: (e.clientY - rect.top) * state.sceneH / rect.height,
                };
            });
            scene.addEventListener('pointerleave', () => { cursor = null; });

            let glow = 0, slit = 0.35, lx = 0, ly = 0;
            let last = performance.now();
            let visible = false;

            const frame = (now) => {
                requestAnimationFrame(frame);
                const dt = Math.min((now - last) / 1000, 0.05);
                last = now;

                // Насколько луч фонарика попадает на глаза (0..1)
                let beam = 0;
                if (!state.isLightOn && FLASHLIGHT_ENABLED && state.flashPointerInside) {
                    const b = state.flashBeam;
                    const d = Math.hypot(b.x - cx, b.y - cy) / b.r;
                    if (d < 1) beam = 1 - d * d;
                }
                const target = state.isLightOn ? 0
                    : CAT_EYES_IDLE_GLOW + (1 - CAT_EYES_IDLE_GLOW) * beam;
                glow += (target - glow) * Math.min(1, dt * 6);

                if (glow < 0.005 && target === 0) {
                    if (visible) { wrap.style.visibility = 'hidden'; visible = false; }
                    return;
                }
                if (!visible) { wrap.style.visibility = 'visible'; visible = true; }

                // Зрачки: широкие в темноте, щёлочки в луче
                slit += ((0.38 - 0.28 * beam) - slit) * Math.min(1, dt * 3);

                // Взгляд следует за курсором (плавно, с ограничением)
                let tx = 0, ty = 0;
                if (cursor) {
                    const dx = cursor.x - cx, dy = cursor.y - cy;
                    const len = Math.hypot(dx, dy) || 1;
                    const k = Math.min(1, len / 120);
                    tx = dx / len * k;
                    ty = dy / len * k;
                }
                lx += (tx - lx) * Math.min(1, dt * 5);
                ly += (ty - ly) * Math.min(1, dt * 5);

                wrap.style.setProperty('--glow', glow.toFixed(3));
                wrap.style.setProperty('--slit', (slit * 100).toFixed(1) + '%');
                wrap.style.setProperty('--lx', lx.toFixed(3));
                wrap.style.setProperty('--ly', ly.toFixed(3));
            };
            requestAnimationFrame(frame);

            // Моргание: иногда двойное
            const blink = () => {
                glows.forEach(g => {
                    if (typeof g.animate !== 'function') return;
                    g.animate([
                        { transform: 'scaleY(1)' },
                        { transform: 'scaleY(0.08)', offset: 0.45 },
                        { transform: 'scaleY(1)' },
                    ], { duration: 180, easing: 'ease-in-out' });
                });
            };
            const scheduleBlink = () => {
                const delay = CAT_BLINK_MIN_DELAY + Math.random() * (CAT_BLINK_MAX_DELAY - CAT_BLINK_MIN_DELAY);
                setTimeout(() => {
                    if (visible) {
                        blink();
                        if (Math.random() < 0.2) setTimeout(blink, 260);
                    }
                    scheduleBlink();
                }, delay);
            };
            scheduleBlink();
        }

        // ========== КЛИКАБЕЛЬНЫЕ ОБЛАСТИ ==========
        function createHotspots() {
            const scene = document.getElementById('scene');
            HOTSPOTS.forEach(zone => {
                const el = document.createElement('div');
                el.className = 'hotspot';
                el.dataset.id = zone.id;
                el.style.left = zone.left + 'px';
                el.style.top = zone.top + 'px';
                el.style.width = zone.width + 'px';
                el.style.height = zone.height + 'px';
                el.addEventListener('click', () => onHotspotClick(zone));
                scene.appendChild(el);
            });
        }

        function onHotspotClick(zone) {
            const zoneData = state.posterById[zone.id];
            if (!zoneData) return;
            if (state.currentExpandedPoster === zoneData) {
                collapsePoster();
                return;
            }
            expandPoster(zoneData);
        }

        // ========== ОСВЕЩЕНИЕ ПОСТЕРА ==========
        function getPosterFilter() {
            return state.isLightOn ? 'brightness(1)' : `brightness(${POSTER_DARK_BRIGHTNESS})`;
        }

        function updateExpandedPosterLighting() {
            if (state.currentExpandedPoster) {
                state.currentExpandedPoster.el.style.filter = getPosterFilter();
            }
        }

        // ========== ПОСТЕРЫ ==========
        function createPosterElements() {
            const scene = document.getElementById('scene');
            const maxW = Math.min(POSTER_MAX_W, state.sceneW * 0.5);
            const maxH = Math.min(POSTER_MAX_H, state.sceneH * 0.85);

            state.loadedPosters.forEach(p => {
                if (!p.img) return;
                const naturalW = p.img.naturalWidth || 300;
                const naturalH = p.img.naturalHeight || 420;
                const ratio = Math.min(maxW / naturalW, maxH / naturalH);
                const finalW = Math.round(naturalW * ratio);
                const finalH = Math.round(naturalH * ratio);

                // Постер — обёртка с картинкой и слоем «старой бумаги» поверх,
                // чтобы все трансформации (разворот, наклон) применялись к обоим
                const el = document.createElement('div');
                el.className = 'poster';
                el.style.width = finalW + 'px';
                el.style.height = finalH + 'px';
                const img = document.createElement('img');
                img.src = p.src;
                img.alt = '';
                img.draggable = false;
                el.appendChild(img);
                if (POSTER_AGE_ENABLED) el.appendChild(createAgedPaperLayer());
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    collapsePoster();
                });
                scene.appendChild(el);

                state.posterById[p.zone.id] = { zone: p.zone, el, finalW, finalH };
            });
        }

        // Слой «старой бумаги»: желтизна к краям, пятна, потёртости, зерно.
        // Пятна случайные — у каждого постера свои.
        function createAgedPaperLayer() {
            const rand = (a, b) => a + Math.random() * (b - a);
            const layers = [];

            // Пятна старости (foxing): 2–4 мягких коричневых пятна
            const spots = 2 + Math.floor(Math.random() * 3);
            for (let i = 0; i < spots; i++) {
                const x = rand(5, 95).toFixed(1), y = rand(5, 95).toFixed(1);
                const r = rand(4, 12).toFixed(1);
                layers.push(`radial-gradient(circle at ${x}% ${y}%, rgba(140, 90, 40, ${rand(0.12, 0.25).toFixed(2)}) 0%, ` +
                    `rgba(140, 90, 40, 0.05) ${r}%, transparent ${(r * 1.6).toFixed(1)}%)`);
            }

            // Желтизна к краям
            layers.push('radial-gradient(ellipse at 50% 50%, transparent 50%, rgba(150, 105, 45, 0.35) 100%)');

            const layer = document.createElement('div');
            layer.className = 'poster-age';
            layer.style.backgroundImage = layers.join(', ') + ', var(--paper-grain)';
            layer.style.opacity = String(POSTER_AGE_STRENGTH);
            return layer;
        }

        function expandPoster(zoneData) {
            if (state.isAnimating) return;
            if (state.currentExpandedPoster) {
                collapsePoster(() => expandPoster(zoneData));
                return;
            }
            state.isAnimating = true;
            playPosterUnfoldSound();

            const poster = zoneData.el;
            const sx = zoneData.zone.width / zoneData.finalW;
            const sy = zoneData.zone.height / zoneData.finalH;
            const centerX = (state.sceneW - zoneData.finalW) / 2;
            const centerY = (state.sceneH - zoneData.finalH) / 2;
            const z = zoneData.zone;
            puffPosterDust({ x: z.left, y: z.top, w: z.width, h: z.height }, 'wall');
            setTimeout(() => puffPosterDust(
                { x: centerX, y: centerY, w: zoneData.finalW, h: zoneData.finalH }, 'unfold'), 240);

            poster.style.display = 'block';
            poster.style.filter = getPosterFilter();
            poster.style.transform = `translate(${zoneData.zone.left}px, ${zoneData.zone.top}px) scale(${sx}, ${sy})`;
            state.currentExpandedPoster = zoneData;

            requestAnimationFrame(() => {
                setTimeout(() => {
                    poster.style.transform = `translate(${centerX}px, ${centerY}px) scale(1, 1)`;
                    setTimeout(() => { state.isAnimating = false; }, 320);
                }, 20);
            });
        }

        function collapsePoster(callback) {
            if (!state.currentExpandedPoster || state.isAnimating) return;
            state.isAnimating = true;
            playPosterFoldSound();

            const zoneData = state.currentExpandedPoster;
            const poster = zoneData.el;
            const sx = zoneData.zone.width / zoneData.finalW;
            const sy = zoneData.zone.height / zoneData.finalH;

            endPosterTilt(zoneData);
            poster.style.transform = `translate(${zoneData.zone.left}px, ${zoneData.zone.top}px) scale(${sx}, ${sy})`;

            setTimeout(() => {
                const z = zoneData.zone;
                puffPosterDust({ x: z.left, y: z.top, w: z.width, h: z.height }, 'land');
                poster.style.display = 'none';
                state.currentExpandedPoster = null;
                state.isAnimating = false;
                if (typeof callback === 'function') callback();
            }, 320);
        }

        // ========== ПЫЛЬ ОТ ПОСТЕРА ==========
        // Постер снимают со стены — с него сыплется пыль; разворачивается —
        // с краёв срывается облачко; возвращается на место — ещё немного пыли
        const POSTER_DUST_ENABLED = true;
        const POSTER_DUST_AMOUNT = 1; // множитель количества пылинок (0.5 — меньше, 2 — больше)

        // ========== ПЫЛЬ ОТ ПОСТЕРА ==========
        // Свой холст поверх постеров; цикл анимации крутится, только пока
        // есть живые пылинки. Мелкие пылинки + несколько мягких «облачков».
        const posterDust = { canvas: null, ctx: null, sprite: null, parts: [], running: false };

        function puffPosterDust(rect, kind) {
            if (!POSTER_DUST_ENABLED || POSTER_DUST_AMOUNT <= 0 || !state.sceneW) return;
            const pd = posterDust;
            if (!pd.canvas) {
                const c = document.createElement('canvas');
                c.id = 'posterDust';
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                c.width = Math.round(state.sceneW * dpr);
                c.height = Math.round(state.sceneH * dpr);
                document.getElementById('scene').appendChild(c);
                pd.canvas = c;
                pd.ctx = c.getContext('2d');
                pd.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                // Мягкое пятно для «облачков»
                const s = document.createElement('canvas');
                s.width = s.height = 64;
                const sc = s.getContext('2d');
                const g = sc.createRadialGradient(32, 32, 0, 32, 32, 32);
                g.addColorStop(0, 'rgba(235, 222, 196, 1)');
                g.addColorStop(0.4, 'rgba(225, 210, 180, 0.45)');
                g.addColorStop(1, 'rgba(220, 205, 175, 0)');
                sc.fillStyle = g;
                sc.fillRect(0, 0, 64, 64);
                pd.sprite = s;
            }

            const rand = (a, b) => a + Math.random() * (b - a);
            // wall — сыплется с места на стене; unfold — срывается с краёв
            // развёрнутого постера; land — оседает при возвращении
            const cfg = {
                wall:   { specks: 22, clouds: 3, speed: 45,  life: [1.2, 2.4], edge: false },
                unfold: { specks: 55, clouds: 8, speed: 150, life: [1.0, 2.2], edge: true },
                land:   { specks: 14, clouds: 2, speed: 35,  life: [1.0, 2.0], edge: false },
            }[kind];
            const now = performance.now();

            const spawn = (cloud) => {
                let x, y, nx, ny;
                if (cfg.edge) {
                    // Случайная точка на периметре и нормаль наружу
                    let t = rand(0, 2 * (rect.w + rect.h));
                    if (t < rect.w) { x = rect.x + t; y = rect.y; nx = 0; ny = -1; }
                    else if ((t -= rect.w) < rect.h) { x = rect.x + rect.w; y = rect.y + t; nx = 1; ny = 0; }
                    else if ((t -= rect.h) < rect.w) { x = rect.x + rect.w - t; y = rect.y + rect.h; nx = 0; ny = 1; }
                    else { t -= rect.w; x = rect.x; y = rect.y + rect.h - t; nx = -1; ny = 0; }
                } else {
                    x = rect.x + rand(0, rect.w);
                    y = rect.y + rand(0, rect.h);
                    const a = Math.atan2(y - (rect.y + rect.h / 2), x - (rect.x + rect.w / 2));
                    nx = Math.cos(a); ny = Math.sin(a);
                }
                const v = cfg.speed * rand(0.3, 1) * (cloud ? 0.5 : 1);
                pd.parts.push({
                    x, y,
                    vx: nx * v + rand(-1, 1) * cfg.speed * 0.25,
                    vy: ny * v + rand(-1, 1) * cfg.speed * 0.25,
                    born: now,
                    life: rand(cfg.life[0], cfg.life[1]) * (cloud ? 1.3 : 1),
                    size: cloud ? rand(10, 22) : (Math.random() < 0.8 ? rand(0.5, 1.3) : rand(1.5, 2.3)),
                    alpha: cloud ? rand(0.12, 0.22) : rand(0.4, 0.85),
                    cloud,
                });
            };
            const n = (k) => Math.round(k * POSTER_DUST_AMOUNT);
            for (let i = 0; i < n(cfg.specks); i++) spawn(false);
            for (let i = 0; i < n(cfg.clouds); i++) spawn(true);
            if (pd.parts.length > 600) pd.parts.splice(0, pd.parts.length - 600);

            if (pd.running) return;
            pd.running = true;
            let last = performance.now();
            const frame = (t) => {
                const ctx = pd.ctx;
                const dt = Math.min((t - last) / 1000, 0.05);
                last = t;
                ctx.clearRect(0, 0, state.sceneW, state.sceneH);
                pd.parts = pd.parts.filter(p => (t - p.born) / 1000 < p.life);
                if (!pd.parts.length) { pd.running = false; return; }

                // В темноте пыль тусклая, как и сам постер
                const light = Math.max(roomLightLevel(), POSTER_DARK_BRIGHTNESS);
                for (const p of pd.parts) {
                    // Сопротивление воздуха, лёгкое оседание и случайное блуждание
                    const drag = p.cloud ? 3 : 2.2;
                    p.vx += (Math.random() * 2 - 1) * 30 * dt - p.vx * drag * dt;
                    p.vy += (Math.random() * 2 - 1) * 30 * dt - p.vy * drag * dt + (p.cloud ? 2 : 10) * dt;
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    if (p.cloud) p.size += 8 * dt; // облачко расплывается

                    const k = (t - p.born) / 1000 / p.life;
                    const a = p.alpha * Math.min(1, k * 10) * (1 - k) ** 1.5 * light;
                    if (a <= 0.005) continue;
                    ctx.globalAlpha = a;
                    if (p.cloud) {
                        ctx.drawImage(pd.sprite, p.x - p.size, p.y - p.size, p.size * 2, p.size * 2);
                    } else {
                        ctx.fillStyle = '#fff3dc';
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                ctx.globalAlpha = 1;
                requestAnimationFrame(frame);
            };
            requestAnimationFrame(frame);
        }

        // ========== НАКЛОН ПОСТЕРА ==========
        // Открытый постер слегка наклоняется в 3D за курсором: сторона под
        // курсором «уходит» от зрителя, тень смещается, по глянцу скользит блик.
        function setupPosterTilt() {
            if (!POSTER_TILT_ENABLED) return;
            const scene = document.getElementById('scene');
            const glare = document.createElement('div');
            glare.id = 'posterGlare';
            scene.appendChild(glare);
            state.posterGlare = glare;

            scene.addEventListener('pointermove', (e) => {
                const zd = state.currentExpandedPoster;
                if (!zd || state.isAnimating) return;
                const rect = scene.getBoundingClientRect();
                const x = (e.clientX - rect.left) * state.sceneW / rect.width;
                const y = (e.clientY - rect.top) * state.sceneH / rect.height;
                // Координаты относительно центра постера (без учёта наклона): -1..1
                const { cx, cy } = posterCenter(zd);
                const nx = (x - cx) / zd.finalW * 2 - 1;
                const ny = (y - cy) / zd.finalH * 2 - 1;
                if (Math.abs(nx) > 1.1 || Math.abs(ny) > 1.1) {
                    resetPosterTilt(zd);
                    return;
                }
                applyPosterTilt(zd, Math.max(-1, Math.min(1, nx)), Math.max(-1, Math.min(1, ny)));
            });
            scene.addEventListener('pointerleave', () => {
                const zd = state.currentExpandedPoster;
                if (zd && !state.isAnimating) resetPosterTilt(zd);
            });
        }

        function posterCenter(zd) {
            return {
                cx: (state.sceneW - zd.finalW) / 2,
                cy: (state.sceneH - zd.finalH) / 2,
            };
        }

        // Трансформация открытого постера с наклоном вокруг его центра
        function tiltTransform(zd, rx, ry) {
            const { cx, cy } = posterCenter(zd);
            const hw = zd.finalW / 2, hh = zd.finalH / 2;
            return `translate(${cx}px, ${cy}px) translate(${hw}px, ${hh}px) perspective(900px) ` +
                `rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) translate(${-hw}px, ${-hh}px)`;
        }

        function applyPosterTilt(zd, nx, ny) {
            const el = zd.el;
            const t = tiltTransform(zd, -ny * POSTER_TILT_MAX, nx * POSTER_TILT_MAX);
            const fast = 'transform 0.12s ease-out, filter 0.12s ease, box-shadow 0.12s ease-out';
            el.style.transition = fast;
            el.style.transform = t;
            el.style.boxShadow =
                `${(-nx * 10).toFixed(1)}px ${(16 - ny * 10).toFixed(1)}px 48px rgba(0,0,0,0.85), ` +
                `${(-nx * 5).toFixed(1)}px ${(8 - ny * 5).toFixed(1)}px 24px rgba(0,0,0,0.7)`;

            const g = state.posterGlare;
            if (!g) return;
            if (g.style.display !== 'block') {
                g.style.display = 'block';
                g.style.width = zd.finalW + 'px';
                g.style.height = zd.finalH + 'px';
            }
            g.style.transition = 'transform 0.12s ease-out, opacity 0.25s ease';
            g.style.transform = t;
            g.style.setProperty('--gx', ((nx + 1) * 50).toFixed(1) + '%');
            g.style.setProperty('--gy', ((ny + 1) * 50).toFixed(1) + '%');
            // В темноте блик слабее — свету неоткуда взяться
            g.style.opacity = String(state.isLightOn ? 1 : 0.3);
        }

        // Плавно вернуть постер в ровное положение (курсор ушёл с постера)
        function resetPosterTilt(zd) {
            const el = zd.el;
            if (!el.style.boxShadow && !(state.posterGlare && state.posterGlare.style.display === 'block')) return;
            el.style.transition = 'transform 0.4s ease, filter 0.12s ease, box-shadow 0.4s ease';
            el.style.transform = tiltTransform(zd, 0, 0);
            el.style.boxShadow = '';
            const g = state.posterGlare;
            if (g && g.style.display === 'block') {
                g.style.transition = 'transform 0.4s ease, opacity 0.3s ease';
                g.style.transform = tiltTransform(zd, 0, 0);
                g.style.opacity = '0';
            }
        }

        // Перед сворачиванием: вернуть стандартную анимацию и убрать блик
        function endPosterTilt(zd) {
            zd.el.style.transition = '';
            zd.el.style.boxShadow = '';
            const g = state.posterGlare;
            if (g) {
                g.style.display = 'none';
                g.style.opacity = '0';
            }
        }

        // Клик мимо постера/областей — свернуть текущий постер
        document.addEventListener('click', (e) => {
            if (!state.currentExpandedPoster) return;
            if (e.target.closest('.hotspot')) return;
            if (e.target.closest('.poster')) return;
            if (e.target.closest('.pull-cord')) return;
            collapsePoster();
        });

        // ========== МЕРЦАНИЕ ==========
        function runFlicker(config) {
            const wrap = document.getElementById('bgWrap');
            const generation = ++state.flickerGeneration;
            const startTime = performance.now();

            function step() {
                if (generation !== state.flickerGeneration) return;
                const elapsed = performance.now() - startTime;
                if (elapsed >= config.duration) {
                    wrap.style.filter = 'brightness(1)';
                    return;
                }
                const level = config.levels[Math.floor(Math.random() * config.levels.length)];
                wrap.style.filter = `brightness(${level})`;
                setTimeout(step, config.minGap + Math.random() * (config.maxGap - config.minGap));
            }
            step();
        }

        function scheduleAmbientFlicker() {
            if (state.ambientFlickerTimer) {
                clearTimeout(state.ambientFlickerTimer);
                state.ambientFlickerTimer = null;
            }
            if (!state.isLightOn) return;

            const delay = AMBIENT_MIN_DELAY + Math.random() * (AMBIENT_MAX_DELAY - AMBIENT_MIN_DELAY);
            state.ambientFlickerTimer = setTimeout(() => {
                if (!state.isLightOn) return;
                playRandomLampSound(); 
                runFlicker(FLICKER_AMBIENT);
                scheduleAmbientFlicker();
            }, delay);
        }

        function stopAmbientFlicker() {
            if (state.ambientFlickerTimer) {
                clearTimeout(state.ambientFlickerTimer);
                state.ambientFlickerTimer = null;
            }
            state.flickerGeneration++;
        }

        // ========== СВЕТ ==========
        function toggleLight() {
            const bgOff = document.getElementById('bgOff');
            const bgOn = document.getElementById('bgOn');
            const wrap = document.getElementById('bgWrap');

            playSwitchSound();
            playCordAnimation();

            if (state.isLightOn) {
                stopAmbientFlicker();
                cancelWarmup();
                wrap.style.filter = 'brightness(1)';
                bgOn.style.opacity = '0';
                bgOff.style.opacity = '1';
                state.isLightOn = false;
                playAfterglow();
            } else {
                state.isLightOn = true;
                playRandomLampSound();
                const startFlicker = () => {
                    runFlicker(FLICKER_AMBIENT);   // то же небольшое мерцание, что и в случайном режиме
                    scheduleAmbientFlicker();
                };
                if (LAMP_WARMUP_ENABLED) {
                    runWarmup(startFlicker);
                } else {
                    bgOff.style.opacity = '0';
                    bgOn.style.opacity = '1';
                    startFlicker();
                }
            }
            updateExpandedPosterLighting();
            updateCordLighting();
            updateFlashlight();
            updateVignette();
            updateLampBeam();
        }

        // ========== КОНУС СВЕТА ОТ ЛАМПЫ ==========
        function setupLampBeam() {
            const beam = document.getElementById('lampBeam');
            if (!beam) return;
            if (!LAMP_BEAM_ENABLED) { beam.remove(); return; }
            const b = LAMP_BEAM;
            const H = state.sceneH;
            const cone = document.getElementById('lampBeamCone');
            // Трапеция: узко у лампочки, широко у пола
            cone.style.clipPath = `polygon(` +
                `${b.x - b.topWidth / 2}px ${b.y}px, ${b.x + b.topWidth / 2}px ${b.y}px, ` +
                `${b.x + b.bottomWidth / 2}px ${H}px, ${b.x - b.bottomWidth / 2}px ${H}px)`;
            cone.style.setProperty('--bx', b.x + 'px');
            cone.style.backgroundPosition = `0 ${b.y}px`;
            cone.style.backgroundRepeat = 'no-repeat';
            cone.style.backgroundSize = `100% ${H - b.y}px`;
            const halo = document.getElementById('lampHalo');
            halo.style.left = b.x + 'px';
            halo.style.top = (b.y - 12) + 'px';
            updateLampBeam();
        }

        function updateLampBeam() {
            if (state.warmupActive) return; // во время разогрева яркостью луча управляет runWarmup
            const beam = document.getElementById('lampBeam');
            if (beam) beam.style.opacity = String(state.isLightOn ? LAMP_BEAM.strength : 0);
        }

        // ========== РАЗОГРЕВ ЛАМПЫ ==========
        function setupFilament() {
            const fil = document.getElementById('filament');
            if (!fil) return;
            // Центр лампочки — чуть выше начала конуса света
            fil.style.left = LAMP_BEAM.x + 'px';
            fil.style.top = (LAMP_BEAM.y - 12) + 'px';
        }

        // Текущая яркость лампы 0..1 (учитывает разогрев) — для пыли и паутины
        function roomLightLevel() {
            if (!state.isLightOn) return 0;
            return state.warmupActive ? state.warmupLevel : 1;
        }

        // Тёплый фильтр: k = 1 — оранжевый, тусклый; k = 0 — обычный свет
        function warmFilter(k) {
            if (k <= 0.001) return '';
            return `sepia(${(0.7 * k).toFixed(3)}) saturate(${(1 + 0.6 * k).toFixed(3)}) ` +
                `hue-rotate(${(-12 * k).toFixed(2)}deg) brightness(${(1 - 0.15 * k).toFixed(3)})`;
        }

        function runWarmup(onDone) {
            const bgOn = document.getElementById('bgOn');
            const bgOff = document.getElementById('bgOff');
            const beam = document.getElementById('lampBeam');
            const fil = document.getElementById('filament');
            const gen = ++state.warmupGen;
            state.warmupActive = true;
            state.warmupLevel = 0;

            // Освещённый фон плавно проявляется поверх тёмного
            bgOn.style.transition = 'none';
            bgOff.style.opacity = '1';
            if (beam) beam.style.transition = 'none';
            if (fil) fil.getAnimations().forEach(a => a.cancel());

            // Иногда лампа «не схватывается»: вспыхивает, почти гаснет и только потом загорается
            const stubborn = Math.random() < LAMP_STUBBORN_CHANCE;
            const pre = stubborn ? 380 : 0;
            const total = pre + LAMP_WARMUP_MS;
            const t0 = performance.now();
            let retried = false;

            const step = (now) => {
                if (gen !== state.warmupGen) return;
                // Метка кадра может быть чуть раньше t0 — не даём времени уйти в минус
                const e = Math.max(0, now - t0);
                let room, glow, warm;
                if (pre > 0 && e < pre) {
                    const u = e / pre;
                    const env = u < 0.45 ? u / 0.45 : 1 - (u - 0.45) / 0.55;
                    glow = 0.85 * env;
                    room = 0.25 * env * env;
                    warm = 1;
                } else {
                    if (stubborn && !retried) { retried = true; playRandomLampSound(); }
                    const u = Math.min(1, (e - pre) / LAMP_WARMUP_MS);
                    // Сначала разгорается спираль, затем свет заливает комнату
                    glow = u < 0.35 ? u / 0.35 : 1 - (u - 0.35) / 0.65;
                    room = u < 0.2 ? 0 : Math.pow((u - 0.2) / 0.8, 2);
                    warm = 1 - room;
                }
                state.warmupLevel = room;
                bgOn.style.opacity = room.toFixed(3);
                bgOn.style.filter = warmFilter(warm);
                if (beam) beam.style.opacity = (room * LAMP_BEAM.strength).toFixed(3);
                if (fil) fil.style.opacity = glow.toFixed(3);

                if (e >= total) {
                    finishWarmup();
                    onDone();
                    return;
                }
                requestAnimationFrame(step);
            };
            requestAnimationFrame(step);
        }

        // Привести всё в обычное «включённое» состояние
        function finishWarmup() {
            const bgOn = document.getElementById('bgOn');
            const bgOff = document.getElementById('bgOff');
            const beam = document.getElementById('lampBeam');
            const fil = document.getElementById('filament');
            state.warmupActive = false;
            bgOn.style.transition = '';
            bgOn.style.filter = '';
            bgOn.style.opacity = '1';
            bgOff.style.opacity = '0';
            if (beam) { beam.style.transition = ''; beam.style.opacity = String(LAMP_BEAM.strength); }
            if (fil) fil.style.opacity = '0';
        }

        // Прервать разогрев (свет выключили раньше, чем лампа разгорелась)
        function cancelWarmup() {
            state.warmupGen++;
            if (!state.warmupActive) return;
            state.warmupActive = false;
            const bgOn = document.getElementById('bgOn');
            const beam = document.getElementById('lampBeam');
            bgOn.style.transition = '';
            bgOn.style.filter = '';
            if (beam) beam.style.transition = '';
        }

        // Остывающая спираль после выключения
        function playAfterglow() {
            if (!LAMP_WARMUP_ENABLED) return;
            const fil = document.getElementById('filament');
            if (!fil || typeof fil.animate !== 'function') return;
            fil.style.opacity = '0';
            fil.animate([
                { opacity: 0.9, filter: 'hue-rotate(0deg)' },
                { opacity: 0.35, filter: 'hue-rotate(-12deg)', offset: 0.4 },
                { opacity: 0, filter: 'hue-rotate(-20deg)' },
            ], { duration: LAMP_AFTERGLOW_MS, easing: 'ease-out' });
        }

        // Насколько точка (x, y) внутри конуса света: 1 — в центре, 0 — снаружи
        function lampBeamFactor(x, y) {
            const b = LAMP_BEAM;
            if (y <= b.y) return 0;
            const k = (y - b.y) / (state.sceneH - b.y);
            const half = (b.topWidth + (b.bottomWidth - b.topWidth) * k) / 2;
            const u = Math.abs(x - b.x) / half;
            return u < 1 ? 1 - u * u : 0;
        }

        // ========== ПАУТИНА ==========
        // Радиальные нити + провисающие кольца + пара оборванных висящих нитей.
        // Узлы — пружинки: курсор рядом расталкивает их и «дует» в сторону
        // своего движения, после чего паутина покачивается и успокаивается.
        function setupCobwebs() {
            const canvas = document.getElementById('cobweb');
            if (!canvas || !canvas.getContext) return;
            if (!COBWEB_ENABLED) { canvas.remove(); return; }
            const ctx = canvas.getContext('2d');
            const W = state.sceneW, H = state.sceneH;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const rand = (a, b) => a + Math.random() * (b - a);
            const RINGS = 7;
            const SPRING = 55, DAMP = 5, PUSH_R = 70, PUSH = 3500, DRAG = 6, MAX_D = 14;

            const webs = COBWEBS.map(cfg => {
                const span = cfg.to - cfg.from;
                const n = Math.max(5, Math.round(span / 13) + 1);
                const radials = [];
                for (let i = 0; i < n; i++) {
                    let a = cfg.from + span * i / (n - 1);
                    if (i > 0 && i < n - 1) a += rand(-3, 3);
                    const rad = a * Math.PI / 180;
                    const len = cfg.r * (i === 0 || i === n - 1 ? 1 : rand(0.8, 1.05));
                    const nodes = [];
                    for (let j = 0; j < RINGS; j++) {
                        const f = 0.16 + 0.84 * j / (RINGS - 1) + (j > 0 ? rand(-0.03, 0.03) : 0);
                        nodes.push({
                            bx: cfg.x + Math.cos(rad) * len * f,
                            by: cfg.y + Math.sin(rad) * len * f,
                            w: f,                     // чем дальше от угла, тем подвижнее
                            dx: 0, dy: 0, vx: 0, vy: 0,
                            ph: rand(0, Math.PI * 2),
                            x: 0, y: 0,
                        });
                    }
                    radials.push(nodes);
                }
                // Порванные участки колец
                const broken = radials.map(() => Array.from({ length: RINGS }, () => Math.random() < 0.12));
                // Висящие оборванные нити (цепочки, физика Верле)
                const chains = Array.from({ length: 2 }, () => {
                    const i = 1 + Math.floor(Math.random() * (n - 2));
                    const j = RINGS - 1 - Math.floor(Math.random() * 2);
                    const node = radials[i][j];
                    const len = rand(25, 55), segs = 7;
                    const pts = Array.from({ length: segs }, (_, k) => {
                        const y = node.by + len * k / (segs - 1);
                        return { x: node.bx, y, px: node.bx, py: y };
                    });
                    return { node, pts, seg: len / (segs - 1) };
                });
                return { cfg, radials, broken, chains };
            });

            // Курсор и его скорость (в координатах фона)
            const scene = document.getElementById('scene');
            let cursor = null, cvx = 0, cvy = 0, lastMove = 0;
            scene.addEventListener('pointermove', (e) => {
                const rect = scene.getBoundingClientRect();
                const x = (e.clientX - rect.left) * W / rect.width;
                const y = (e.clientY - rect.top) * H / rect.height;
                const now = performance.now();
                if (cursor && now > lastMove) {
                    const k = 1000 / Math.max(8, now - lastMove);
                    cvx = cvx * 0.5 + (x - cursor.x) * k * 0.5;
                    cvy = cvy * 0.5 + (y - cursor.y) * k * 0.5;
                }
