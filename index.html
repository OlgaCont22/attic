                cursor = { x, y };
                lastMove = now;
            });
            scene.addEventListener('pointerleave', () => { cursor = null; });

            let lightMix = state.isLightOn ? 1 : 0;
            let last = performance.now();

            const physics = (dt, t) => {
                cvx *= Math.pow(0.02, dt);
                cvy *= Math.pow(0.02, dt);
                for (const web of webs) {
                    for (const nodes of web.radials) {
                        for (const p of nodes) {
                            let ax = -SPRING * p.dx - DAMP * p.vx + Math.sin(t * 0.8 + p.ph) * 4;
                            let ay = -SPRING * p.dy - DAMP * p.vy + Math.cos(t * 0.6 + p.ph) * 2;
                            if (cursor) {
                                const ex = p.bx + p.dx * p.w - cursor.x;
                                const ey = p.by + p.dy * p.w - cursor.y;
                                const d = Math.hypot(ex, ey);
                                if (d < PUSH_R) {
                                    const k = (1 - d / PUSH_R) ** 2;
                                    ax += (ex / (d || 1)) * PUSH * k + cvx * DRAG * k;
                                    ay += (ey / (d || 1)) * PUSH * k + cvy * DRAG * k;
                                }
                            }
                            p.vx += ax * dt; p.vy += ay * dt;
                            p.dx += p.vx * dt; p.dy += p.vy * dt;
                            const m = Math.hypot(p.dx, p.dy);
                            if (m > MAX_D) { p.dx *= MAX_D / m; p.dy *= MAX_D / m; }
                            p.x = p.bx + p.dx * p.w;
                            p.y = p.by + p.dy * p.w;
                        }
                    }
                    for (const c of web.chains) {
                        const pts = c.pts;
                        pts[0].x = c.node.x; pts[0].y = c.node.y;
                        for (let k = 1; k < pts.length; k++) {
                            const q = pts[k];
                            let fx = Math.sin(t * 0.9 + k) * 6, fy = 220;
                            if (cursor) {
                                const ex = q.x - cursor.x, ey = q.y - cursor.y;
                                const d = Math.hypot(ex, ey);
                                if (d < PUSH_R) {
                                    const s = (1 - d / PUSH_R) ** 2;
                                    fx += (ex / (d || 1)) * 900 * s + cvx * 4 * s;
                                    fy += (ey / (d || 1)) * 900 * s + cvy * 4 * s;
                                }
                            }
                            const nx = q.x + (q.x - q.px) * 0.97 + fx * dt * dt;
                            const ny = q.y + (q.y - q.py) * 0.97 + fy * dt * dt;
                            q.px = q.x; q.py = q.y;
                            q.x = nx; q.y = ny;
                        }
                        for (let it = 0; it < 4; it++) {
                            for (let k = 1; k < pts.length; k++) {
                                const a = pts[k - 1], b = pts[k];
                                const dx = b.x - a.x, dy = b.y - a.y;
                                const d = Math.hypot(dx, dy) || 1;
                                const diff = (d - c.seg) / d;
                                if (k === 1) { b.x -= dx * diff; b.y -= dy * diff; }
                                else {
                                    a.x += dx * diff / 2; a.y += dy * diff / 2;
                                    b.x -= dx * diff / 2; b.y -= dy * diff / 2;
                                }
                            }
                        }
                    }
                }
            };

            const drawWebs = () => {
                ctx.beginPath();
                for (const web of webs) {
                    const { x: ax, y: ay } = web.cfg;
                    const R = web.radials;
                    // Радиальные нити
                    for (const nodes of R) {
                        ctx.moveTo(ax, ay);
                        for (const p of nodes) ctx.lineTo(p.x, p.y);
                    }
                    // Кольца, слегка провисающие к центру
                    for (let j = 0; j < RINGS; j++) {
                        for (let i = 0; i < R.length - 1; i++) {
                            if (web.broken[i][j]) continue;
                            const a = R[i][j], b = R[i + 1][j];
                            const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
                            ctx.moveTo(a.x, a.y);
                            ctx.quadraticCurveTo(mx + (ax - mx) * 0.12, my + (ay - my) * 0.12, b.x, b.y);
                        }
                    }
                    // Висящие нити
                    for (const c of web.chains) {
                        ctx.moveTo(c.pts[0].x, c.pts[0].y);
                        for (let k = 1; k < c.pts.length; k++) ctx.lineTo(c.pts[k].x, c.pts[k].y);
                    }
                }
                ctx.stroke();
            };

            const frame = (now) => {
                requestAnimationFrame(frame);
                const dt = Math.min((now - last) / 1000, 0.033);
                last = now;
                lightMix += (roomLightLevel() - lightMix) * Math.min(1, Math.max(0, dt) * 4);
                if (!Number.isFinite(lightMix)) lightMix = roomLightLevel();
                const beamOn = FLASHLIGHT_ENABLED && !state.isLightOn && state.flashPointerInside;
                ctx.clearRect(0, 0, W, H);
                if (lightMix < 0.01 && !beamOn) return;

                physics(dt, now / 1000);

                ctx.lineWidth = 0.7;
                ctx.strokeStyle = 'rgba(240, 236, 225, 1)';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
                ctx.shadowBlur = 1;
                ctx.shadowOffsetY = 1;
                const lit = lightMix * COBWEB_OPACITY;
                ctx.globalAlpha = beamOn ? 1 : lit;
                drawWebs();
                ctx.shadowColor = 'transparent';
                ctx.globalAlpha = 1;

                if (beamOn) {
                    // В темноте оставляем только то, что попало в луч фонарика
                    const b = state.flashBeam;
                    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
                    g.addColorStop(0, 'rgba(0,0,0,0.9)');
                    g.addColorStop(0.6, 'rgba(0,0,0,0.5)');
                    g.addColorStop(1, `rgba(0,0,0,${lit.toFixed(3)})`);
                    ctx.globalCompositeOperation = 'destination-in';
                    ctx.fillStyle = g;
                    ctx.fillRect(0, 0, W, H);
                    ctx.globalCompositeOperation = 'source-over';
                }
            };
            requestAnimationFrame(frame);
        }

        // ========== КОШКА-ТЕНЬ ==========
        // Силуэт рисуется кодом (тело, голова с ушами, хвост, 4 ноги с шагом).
        // Появляется только в темноте, считая время, проведённое без света.
        // Для проверки можно вызвать в консоли: catShadowWalk()
        function setupCatShadow() {
            const canvas = document.getElementById('catShadow');
            if (!canvas || !canvas.getContext) return;
            if (!CAT_SHADOW_ENABLED) { canvas.remove(); return; }
            const ctx = canvas.getContext('2d');
            const W = state.sceneW, H = state.sceneH;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const P = CAT_SHADOW_PATH;
            const rand = (a, b) => a + Math.random() * (b - a);
            let darkTime = 0;
            let nextAt = CAT_SHADOW_FIRST_DELAY;
            let walk = null;
            let last = performance.now();

            const start = () => {
                const dir = Math.random() < 0.5 ? 1 : -1; // 1 — вправо
                walk = {
                    dir,
                    x: dir === 1 ? P.leftX - 70 : P.rightX + 70,
                    endX: dir === 1 ? P.rightX + 70 : P.leftX - 70,
                    speed: P.speed,
                    phase: 0,
                    mode: 'walk',       // walk → freeze → run
                    freezeT: 0,
                    eye: 0,
                    run: 0,             // плавные переходы позы
                    startle: 0,
                    stride: CAT_STRIDE_WALK,
                    duty: CAT_DUTY_WALK,
                    glintAt: rand(0.3, 0.7), // где на пути блеснут глаза
                    glintT: -1,
                    footUp: PAW_LEGS.map(() => true), // лапа в воздухе (для следов)
                };
            };
            window.catShadowWalk = () => { if (!state.isLightOn) start(); };

            // Силуэт рисуется целиком непрозрачным в маленький буфер, а на сцену
            // кладётся одним слоем с прозрачностью: иначе в местах, где лапы,
            // шея и хвост накладываются на тело, проступали бы тёмные пятна.
            const BUF_W = 140, BUF_H = 100, BUF_OX = 70, BUF_OY = 82; // в единицах кошки
            const buf = document.createElement('canvas');
            buf.width = Math.ceil(BUF_W * P.scale * dpr);
            buf.height = Math.ceil(BUF_H * P.scale * dpr);
            const bctx = buf.getContext('2d');
            const lerp = (a, b, k) => a + (b - a) * k;

            // Рисует кошку в локальных координатах: x — вперёд, y — вниз, 0 — пол.
            // pose: stride — вынос лапы, duty — доля шага на опоре,
            // run 0..1 — бег (галоп), startle 0..1 — испуг. Возвращает центр головы.
            // Всё строится из плавных контуров (сплайн через «скелет»), а по краю
            // идёт шерсть — короткие пряди: пушистые грудь, живот, «штаны» и хвост,
            // гладкая голова. Круглая голова с короткой мордой и крупными ушами,
            // компактное глубокое тело, толстый хвост с круглым кончиком.
            const hash = (i) => { const v = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return v - Math.floor(v); };
            // Плотная ломаная через точки (сплайн Катмулла–Рома)
            const curve = (pts, per = 5) => {
                const out = [], n = pts.length;
                for (let i = 0; i < n; i++) {
                    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
                    for (let j = 0; j < per; j++) {
                        const u = j / per, u2 = u * u, u3 = u2 * u;
                        const f = (k) => 0.5 * (2 * p1[k] + (p2[k] - p0[k]) * u
                            + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * u2
                            + (3 * p1[k] - p0[k] - 3 * p2[k] + p3[k]) * u3);
                        out.push([f(0), f(1)]);
                    }
                }
                return out;
            };
            // Контур конечности/хвоста по цепочке суставов J с полуширинами R
            const outline = (J, R) => {
                const a = [], b = [];
                for (let i = 0; i < J.length; i++) {
                    const p = J[Math.max(0, i - 1)], q = J[Math.min(J.length - 1, i + 1)];
                    let tx = q[0] - p[0], ty = q[1] - p[1];
                    const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
                    a.push([J[i][0] - ty * R[i], J[i][1] + tx * R[i]]);
                    b.push([J[i][0] + ty * R[i], J[i][1] - tx * R[i]]);
                }
                // скругление на конце
                const e = J[J.length - 1], d = J[J.length - 2], el = Math.hypot(e[0] - d[0], e[1] - d[1]) || 1;
                const r = R[R.length - 1] * 0.9;
                a.push([e[0] + (e[0] - d[0]) / el * r, e[1] + (e[1] - d[1]) / el * r]);
                return a.concat(b.reverse());
            };

            const drawCatShape = (c, phase, t, pose) => {
                const { stride, run, startle, duty } = pose;
                c.fillStyle = c.strokeStyle = 'rgb(5, 5, 8)';
                c.lineCap = c.lineJoin = 'round';
                const calm = (1 - run) * (1 - startle);
                // Шагом кошка движется почти без качки; на галопе тело
                // подпрыгивает, а спина сжимается и распрямляется
                const by = Math.sin(phase * 2) * 0.5 * (1 - run) + run * (2.5 + Math.sin(phase) * 1.2) + startle * 1.5;
                const ext = run * 2.5 * Math.sin(phase);
                const arch = startle * 4.5;

                const poly = (ps) => {
                    c.beginPath();
                    c.moveTo(ps[0][0], ps[0][1]);
                    for (let i = 1; i < ps.length; i++) c.lineTo(ps[i][0], ps[i][1]);
                    c.closePath();
                    c.fill();
                };
                // Шерсть: пряди-треугольнички по контуру, наружу и по ходу шерсти.
                // len(p, nx, ny) — длина пряди в точке с внешней нормалью (nx, ny)
                const fur = (ps, len, seed, flow = [-0.9, 0.45]) => {
                    let area = 0;
                    for (let i = 0; i < ps.length; i++) {
                        const p = ps[i], q = ps[(i + 1) % ps.length];
                        area += p[0] * q[1] - q[0] * p[1];
                    }
                    const sgn = area > 0 ? 1 : -1, n = ps.length;
                    for (let i = 0; i < n; i++) {
                        const p = ps[i], a = ps[(i - 1 + n) % n], b = ps[(i + 1) % n];
                        let tx = b[0] - a[0], ty = b[1] - a[1];
                        const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
                        const nx = ty * sgn, ny = -tx * sgn;
                        const l = len(p, nx, ny) * (0.55 + 0.9 * hash(i + seed));
                        if (l < 0.2) continue;
                        const w = 0.55 + l * 0.25;
                        c.beginPath();
                        c.moveTo(p[0] - tx * w - nx * 0.4, p[1] - ty * w - ny * 0.4);
                        c.lineTo(p[0] + nx * l * 0.9 + flow[0] * l * 0.5, p[1] + ny * l * 0.9 + flow[1] * l * 0.5);
                        c.lineTo(p[0] + tx * w - nx * 0.4, p[1] + ty * w - ny * 0.4);
                        c.fill();
                    }
                };

                // Мягкая тень под лапами
                c.globalAlpha = 0.3;
                c.beginPath();
                c.ellipse(-1, 0.4, 24 + run * 6, 1.6, 0, 0, Math.PI * 2);
                c.fill();
                c.globalAlpha = 1;

                // Двухзвенная инверсная кинематика: где сустав между a и b.
                // side = 1 — сустав сзади (локоть), -1 — спереди (колено)
                const ik = (ax, ay, bx, by2, l1, l2, side) => {
                    const dx = bx - ax, dy = by2 - ay;
                    const d = Math.min(Math.max(Math.hypot(dx, dy), Math.abs(l1 - l2) + 0.01), l1 + l2 - 0.01);
                    const a = Math.acos((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d));
                    const th = Math.atan2(dy, dx) + side * a;
                    return [ax + Math.cos(th) * l1, ay + Math.sin(th) * l1];
                };
                // Сгиб запястья/скакательного сустава: сильнее в начале переноса
                const flexOf = (f) => (f.swing >= 0 ? Math.sin(Math.PI * Math.min(1, f.swing * 1.3)) : 0);
                const paw = (x, y, rot, k) => {
                    c.beginPath();
                    c.ellipse(x, y, 2.4 * k, 1.5 * k, rot, 0, Math.PI * 2);
                    c.fill();
                };
                const legFur = (ps, seed) => fur(ps, (p) => (p[1] < -15 + by ? 0 : 0.45), seed);

                // Передняя: плечо → локоть (сзади) → запястье → лапа
                const frontLeg = (l, f, k, near) => {
                    const sx = l.hx + ext - 1.5, sy = -22 + by;
                    const fx = l.hx + ext + f.x, fy = -f.lift * (4 + run * 3);
                    const fl = flexOf(f);
                    const wx = fx - fl * 1.5, wy = fy - 3 + fl * 0.5;
                    const [ex, ey] = ik(sx, sy, wx, wy, 8.5, 9.5, 1);
                    const px = wx + lerp(1, -2.6, fl), py = wy + lerp(1.8, 1.6, fl);
                    const ps = curve(outline([[sx + 1, sy - 2], [sx, sy], [ex, ey], [wx, wy], [px, py]],
                        [5.5 * k, 4.6 * k, 2.6 * k, 1.6 * k, 1.6 * k]), 4);
                    poly(ps);
                    if (near) legFur(ps, l.hx * 7);
                    paw(px + 0.9 * (1 - fl), py + 0.1, fl * 0.9, k);
                };
                // Задняя: бедро (сливается с крупом) → колено → голень →
                // скакательный сустав → стопа
                const hindLeg = (l, f, k, near) => {
                    const hx0 = l.hx - ext, hy0 = -23 + by;
                    const fx = hx0 + f.x, fy = -f.lift * (3.5 + run * 3);
                    const fl = flexOf(f);
                    const kx = fx - 3.2 - fl * 1.5, ky = fy - 6.5 + fl * 1.5;
                    const [nx, ny] = ik(hx0, hy0, kx, ky, 10, 11, -1);
                    const ps = curve(outline([[hx0 - 1, hy0 - 3], [hx0, hy0], [nx, ny], [kx, ky], [fx, fy - 1.3]],
                        [7 * k, 6.5 * k, 3.8 * k, 1.6 * k, 1.5 * k]), 4);
                    poly(ps);
                    if (near) legFur(ps, l.hx * 13);
                    paw(fx + 1.1, fy - 1.2, fl * 0.6, k);
                };

                const legs = PAW_LEGS.map(l => ({ l, f: catFoot(phase, catLegOff(l, run), stride, duty) }));
                const drawLeg = ({ l, f }) => (l.front ? frontLeg : hindLeg)(l, f, l.near ? 1 : 0.9, l.near);
                legs.filter(g => !g.l.near).forEach(drawLeg); // дальние — за телом

                // Хвост: цепочка звеньев, толщина почти постоянная, кончик круглый.
                // Шагом поднят дугой с загнутым кончиком, по нему бежит волна;
                // на бегу вытянут назад, при испуге — распушённой трубой
                const th0 = lerp(lerp(-2.4, -2.95, run), -1.75, startle);
                const kap = lerp(lerp(0.06, 0.01, run), 0.02, startle);
                const puff = 1 + startle * 0.8;
                const J = [[-20.5 - ext, -27 + by]];
                const TR = [];
                let x = J[0][0], y = J[0][1], th = th0;
                const SEG = 12, L = 2.7;
                for (let i = 1; i <= SEG; i++) {
                    const u = i / SEG;
                    th += kap + (u > 0.7 ? 0.2 * calm : 0)
                        + Math.sin(t * 2.2 - i * 0.45) * 0.045 * (1 - run * 0.7)
                        + Math.sin(t * 11 - i * 0.6) * 0.04 * run;
                    x += Math.cos(th) * L; y += Math.sin(th) * L;
                    J.push([x, y]);
                }
                J.forEach((_, i) => TR.push((i === 0 ? 3.2 : 2.4 - Math.max(0, i / SEG - 0.75) * 2.5) * puff));
                const tailPs = curve(outline(J, TR), 3);
                poly(tailPs);
                const tdir = [J[SEG][0] - J[0][0], J[SEG][1] - J[0][1]];
                const tdl = Math.hypot(tdir[0], tdir[1]) || 1;
                fur(tailPs, () => (0.75 + startle * 0.5) * puff, 91, [tdir[0] / tdl * 0.8, tdir[1] / tdl * 0.8]);

                // Лопатка и таз выступают над спиной, когда лапа отведена назад
                const nearF = legs.find(g => g.l.near && g.l.front).f;
                const nearH = legs.find(g => g.l.near && !g.l.front).f;
                const sh = Math.max(0, -nearF.x / stride) * 1.4 * (1 - run * 0.5);
                const hp = Math.max(0, -nearH.x / stride) * 1;

                // Голова: шагом — чуть ниже холки и почти неподвижна,
                // на бегу вытянута вперёд
                const Hx = 24.5 + ext + run * 3;
                const Hy = -32 + by * 0.3 + run * 3 + startle * 0.5 + Math.sin(phase * 2 + 1) * 0.35 * (1 - run);

                // Единый контур: круп → спина → холка → голова → жабо → живот → «штаны»
                const F = ext, R = -ext; // сдвиг передней и задней половины на галопе
                const bodyPs = curve([
                    [-19 + R, -28.5 + by - hp - arch * 0.4],  // крестец
                    [-8, -29.6 + by - arch],
                    [4, -29.6 + by - arch * 0.7],
                    [13 + F, -30.6 + by - sh - arch * 0.2],   // холка
                    [Hx - 7.5, Hy - 4.2],                     // загривок
                    [Hx - 4.5, Hy - 6.6],                     // затылок
                    [Hx + 0.5, Hy - 7.2],                     // темя
                    [Hx + 4.6, Hy - 5.2],                     // лоб
                    [Hx + 6.8, Hy - 2.2],                     // переносица
                    [Hx + 7.8, Hy + 0.4],                     // нос
                    [Hx + 7.1, Hy + 2.6],                     // губа
                    [Hx + 4.6, Hy + 4.2],                     // подбородок
                    [Hx + 0.8, Hy + 5.6],                     // щека
                    [Hx - 2.5, Hy + 7.8],                     // жабо
                    [20.5 + F, -21.5 + by],
                    [20.5 + F, -17.5 + by],                   // грудь
                    [16 + F, -13.8 + by],
                    [5, -14.6 + by],                          // живот
                    [-7, -13.8 + by],                         // складка живота
                    [-15 + R, -14.5 + by],
                    [-21 + R, -17 + by],                      // «штаны»
                    [-24 + R, -21.5 + by],
                    [-23 + R, -26 + by],                      // круп
                ], 6);
                poly(bodyPs);
                fur(bodyPs, (p, nx, ny) => {
                    if (p[0] > Hx - 4.5 && p[1] < Hy + 4.5) return 0.25; // голова гладкая
                    if (ny > 0.55) return 1.2;                          // живот, низ груди
                    if (p[0] > 12 && nx > 0.2) return 1.3;              // жабо
                    if (p[0] < -17 && nx < -0.2) return 1.1;            // «штаны»
                    return 0.5;
                }, 3);

                // Уши: широкое основание, передний край прямой, задний выпуклый;
                // на бегу прижаты, при испуге насторожены
                const flat = run * 0.8 - startle * 0.15;
                const ear = (b1x, b1y, tx, ty, b2x, b2y) => {
                    tx += Hx - flat * 4.5; ty += Hy + flat * 4.5;
                    b1x += Hx; b1y += Hy; b2x += Hx; b2y += Hy;
                    c.beginPath();
                    c.moveTo(b1x, b1y);
                    c.quadraticCurveTo((b1x + tx) / 2 - 1.2, (b1y + ty) / 2 + 0.3, tx, ty);
                    c.quadraticCurveTo((tx + b2x) / 2 + 0.3, (ty + b2y) / 2, b2x, b2y);
                    c.closePath();
                    c.fill();
                };
                ear(0.2, -6.8, 3.4, -12.6, 6.2, -4.4);    // дальнее
                ear(-5.6, -5, -2.6, -13.2, 1.2, -7);      // ближнее
                // Усы
                c.lineWidth = 0.32;
                c.beginPath();
                c.moveTo(Hx + 6.6, Hy + 1.9); c.quadraticCurveTo(Hx + 10.5, Hy + 0.8, Hx + 14.5, Hy + 1.5);
                c.moveTo(Hx + 6.6, Hy + 2.4); c.quadraticCurveTo(Hx + 10.5, Hy + 2.7, Hx + 14, Hy + 4.3);
                c.moveTo(Hx + 6.2, Hy + 2.8); c.quadraticCurveTo(Hx + 9.5, Hy + 4.2, Hx + 12.5, Hy + 6.6);
                c.stroke();

                legs.filter(g => g.l.near).forEach(drawLeg);
                return { hx: Hx, hy: Hy };
            };

            const drawCat = (x, y, dir, phase, s, t, eye, pose) => {
                // 1) непрозрачный силуэт в буфер
                bctx.setTransform(1, 0, 0, 1, 0, 0);
                bctx.clearRect(0, 0, buf.width, buf.height);
                bctx.setTransform(dpr * s * dir, 0, 0, dpr * s, buf.width / 2 + dir * dpr * s * (BUF_OX - BUF_W / 2), dpr * s * BUF_OY);
                const head = drawCatShape(bctx, phase, t, pose);

                // 2) на сцену — одним слоем, с чуть размытым краем, как у тени
                ctx.save();
                ctx.globalAlpha = CAT_SHADOW_OPACITY;
                if ('filter' in ctx) ctx.filter = 'blur(0.5px)';
                const bx = x - s * (dir === 1 ? BUF_OX : BUF_W - BUF_OX);
                ctx.drawImage(buf, bx, y - s * BUF_OY, BUF_W * s, BUF_H * s);
                ctx.restore();

                // 3) глаза — в полную яркость, независимо от прозрачности силуэта
                if (eye > 0.01) {
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.scale(dir * s, s);
                    ctx.fillStyle = `rgba(200, 255, 100, ${eye.toFixed(3)})`;
                    ctx.shadowColor = 'rgba(180, 255, 80, 0.9)';
                    ctx.shadowBlur = 6;
                    const { hx, hy } = head;
                    const open = 1 - pose.run * 0.3; // на бегу прищурены
                    ctx.beginPath();
                    ctx.ellipse(hx + 4, hy - 1.8, 1.7, 1.15 * open, -0.2, 0, Math.PI * 2);
                    ctx.ellipse(hx + 6.6, hy - 1.9, 0.6, 0.9 * open, -0.2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            };

            const frame = (now) => {
                requestAnimationFrame(frame);
                const dt = Math.min((now - last) / 1000, 0.05);
                last = now;
                const t = now / 1000;

                if (state.isLightOn) {
                    // Включили свет — кошки как не бывало
                    if (walk) { walk = null; ctx.clearRect(0, 0, W, H); }
                    return;
                }
                if (!walk) {
                    darkTime += dt * 1000;
                    if (darkTime >= nextAt) {
                        darkTime = 0;
                        nextAt = rand(CAT_SHADOW_MIN_DELAY, CAT_SHADOW_MAX_DELAY);
                        start();
                    }
                    if (!walk) return;
                }

                const w = walk;
                const total = Math.abs(w.endX - (w.dir === 1 ? P.leftX - 70 : P.rightX + 70));
                const progress = 1 - Math.abs(w.endX - w.x) / total;

                // Попала в луч фонарика?
                if (w.mode === 'walk' && FLASHLIGHT_ENABLED && state.flashPointerInside) {
                    const b = state.flashBeam;
                    if (Math.hypot(b.x - w.x, b.y - (P.y - 25 * P.scale)) < b.r * 0.6) {
                        w.mode = 'freeze';
                        w.freezeT = 0.5;
                    }
                }

                let eyeTarget = 0;
                if (w.mode === 'walk') {
                    w.x += w.dir * w.speed * dt;
                    w.phase += catPhaseRate(w) * dt;
                    if (w.glintT < 0 && progress >= w.glintAt) w.glintT = 0;
                    if (w.glintT >= 0 && w.glintT < 0.5) {
                        w.glintT += dt;
                        eyeTarget = 0.7;
                    }
                } else if (w.mode === 'freeze') {
                    w.freezeT -= dt;
                    eyeTarget = 1;
                    if (w.freezeT <= 0) { w.mode = 'run'; w.speed *= CAT_SHADOW_RUN_SPEEDUP; }
                } else {
                    w.x += w.dir * w.speed * dt;
                    w.phase += catPhaseRate(w) * dt;
                    eyeTarget = 0.4;
                }
                w.eye += (eyeTarget - w.eye) * Math.min(1, dt * 12);
                w.run += ((w.mode === 'run' ? 1 : 0) - w.run) * Math.min(1, dt * 8);
                w.startle += ((w.mode === 'freeze' ? 1 : 0) - w.startle) * Math.min(1, dt * (w.mode === 'freeze' ? 14 : 4));
                w.stride = lerp(CAT_STRIDE_WALK, CAT_STRIDE_RUN, w.run);
                w.duty = lerp(CAT_DUTY_WALK, CAT_DUTY_RUN, w.run);

                // Лапа коснулась пола — след (та же походка, что в drawCatShape)
                if (state.addPawPrint) {
                    PAW_LEGS.forEach((l, i) => {
                        const f = catFoot(w.phase, catLegOff(l, w.run), w.stride, w.duty);
                        const up = f.swing >= 0;
                        if (w.footUp[i] && !up) {
                            const fx = l.hx + f.x;
                            state.addPawPrint(w.x + w.dir * P.scale * fx,
                                P.y + (l.near ? 1.5 : -1) * P.scale, w.dir);
                        }
                        w.footUp[i] = up;
                    });
                }

                ctx.clearRect(0, 0, W, H);
                if ((w.dir === 1 && w.x >= w.endX) || (w.dir === -1 && w.x <= w.endX)) {
                    walk = null;
                    return;
                }

                // Видно только между стопками постеров и не поверх настоящей кошки
                ctx.save();
                ctx.beginPath();
                ctx.rect(P.leftX, 0, P.rightX - P.leftX, H);
                CAT_SHADOW_HIDE.forEach(poly => {
                    ctx.moveTo(poly[0][0], poly[0][1]);
                    for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i][0], poly[i][1]);
                    ctx.closePath();
                });
                ctx.clip('evenodd');
                ctx.globalAlpha = CAT_SHADOW_OPACITY;
                drawCat(w.x, P.y, w.dir, w.phase, P.scale, t, w.eye, w);
                ctx.restore();
            };
            requestAnimationFrame(frame);
        }

        // ========== СВЕТ ИЗ ЩЕЛЕЙ В ПОЛУ ==========
        // Каждая щель — несколько отрезков разной яркости (где-то доски
        // прилегают плотно). Отрезок: широкое мягкое свечение + тонкая
        // яркая линия; ближе к зрителю — толще (перспектива).
        function setupFloorCracks() {
            const canvas = document.getElementById('floorCracks');
            if (!canvas || !canvas.getContext) return;
            if (!FLOOR_CRACKS_ENABLED) { canvas.remove(); return; }
            const ctx = canvas.getContext('2d');
            const W = state.sceneW, H = state.sceneH;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const F = FLOOR_CRACKS;
            const rand = (a, b) => a + Math.random() * (b - a);
            const xAt = (xb, y) => F.vpX + (xb - F.vpX) * (y - F.vpY) / (F.bottomY - F.vpY);

            // Отрезки щелей: t от 0 (у стены) до 1 (у края сцены)
            const segments = [];
            F.xs.forEach(xb => {
                let t = rand(0, 0.15);
                while (t < 1) {
                    const len = rand(0.15, 0.5);
                    const t2 = Math.min(1, t + len);
                    const y1 = F.topY + (F.bottomY - F.topY) * t;
                    const y2 = F.topY + (F.bottomY - F.topY) * t2;
                    segments.push({
                        x1: xAt(xb, y1), y1, x2: xAt(xb, y2), y2,
                        persp: 0.45 + 0.55 * (t + t2) / 2,
                        bright: rand(0.4, 1),
                        ph: rand(0, Math.PI * 2),
                    });
                    t = t2 + rand(0.03, 0.15); // плотно прилегающий участок
                }
            });

            const clipPath = () => {
                ctx.beginPath();
                const poly = (pts) => {
                    ctx.moveTo(pts[0][0], pts[0][1]);
                    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
                    ctx.closePath();
                };
                poly(FLOOR_AREA);
                CAT_SHADOW_HIDE.forEach(poly);
                poly(FLOOR_TAIL_HIDE);
                ctx.clip('evenodd');
            };

            let level = state.isLightOn ? FLOOR_CRACK_LIT : FLOOR_CRACK_STRENGTH;
            let walker = null;
            let darkTime = 0;
            let nextWalker = rand(FLOOR_WALKER_MIN_DELAY, FLOOR_WALKER_MAX_DELAY);
            // Для проверки в консоли: floorWalker() — тень пройдёт сразу (в темноте)
            window.floorWalker = () => { darkTime = nextWalker; };
            let drawn = false;
            let last = performance.now();

            const frame = (now) => {
                requestAnimationFrame(frame);
                const dt = Math.min((now - last) / 1000, 0.05);
                last = now;
                const t = now / 1000;

                const light = roomLightLevel();
                const target = FLOOR_CRACK_LIT * light + FLOOR_CRACK_STRENGTH * (1 - light);
                level += (target - level) * Math.min(1, dt * 5);

                // Кто-то проходит внизу — тень плывёт поперёк щелей
                if (!state.isLightOn) {
                    if (!walker) {
                        darkTime += dt * 1000;
                        if (darkTime >= nextWalker) {
                            darkTime = 0;
                            nextWalker = rand(FLOOR_WALKER_MIN_DELAY, FLOOR_WALKER_MAX_DELAY);
                            const dir = Math.random() < 0.5 ? 1 : -1;
                            walker = { dir, x: dir === 1 ? -80 : W + 80, speed: rand(110, 170) };
                        }
                    }
                }
                if (walker) {
                    walker.x += walker.dir * walker.speed * dt;
                    if (walker.x < -100 || walker.x > W + 100) walker = null;
                }

                if (drawn) { ctx.clearRect(0, 0, W, H); drawn = false; }
                if (level < 0.01) return;

                // Мягкое дрожание, как от лампы или телевизора внизу
                const flicker = 1 + 0.07 * Math.sin(t * 1.7) + 0.04 * Math.sin(t * 4.3 + 1)
                    + 0.03 * Math.sin(t * 11.1 + 2);

                ctx.save();
                clipPath();
                ctx.lineCap = 'round';
                for (const s of segments) {
                    let k = level * flicker * s.bright * (0.85 + 0.15 * Math.sin(t * 0.8 + s.ph));
                    if (walker) {
                        // Тень от ног: обе ноги рядом, шаг чуть раскачивает
                        const mx = (s.x1 + s.x2) / 2;
                        const sway = Math.sin(walker.x * 0.08) * 12;
                        const d1 = (mx - walker.x - sway) / 22;
                        const d2 = (mx - walker.x + sway) / 22;
                        k *= 1 - 0.9 * Math.max(Math.exp(-d1 * d1), Math.exp(-d2 * d2));
                    }
                    if (k <= 0.01) continue;
                    ctx.beginPath();
                    ctx.moveTo(s.x1, s.y1);
                    ctx.lineTo(s.x2, s.y2);
                    // свечение
                    ctx.globalAlpha = Math.min(1, 0.18 * k);
                    ctx.strokeStyle = 'rgb(255, 150, 60)';
                    ctx.lineWidth = 5 * s.persp;
                    ctx.stroke();
                    // яркая сердцевина
                    ctx.globalAlpha = Math.min(1, 0.85 * k);
                    ctx.strokeStyle = 'rgb(255, 205, 130)';
                    ctx.lineWidth = 1.1 * s.persp;
                    ctx.stroke();
                }
                ctx.restore();
                ctx.globalAlpha = 1;
                drawn = true;
            };
            requestAnimationFrame(frame);
        }

        // ========== СВЕТЛЯЧКИ ==========
        function setupFireflies() {
            const canvas = document.getElementById('fireflies');
            if (!canvas || !canvas.getContext) return;
            if (!FIREFLIES_ENABLED || FIREFLY_COUNT <= 0) { canvas.remove(); return; }
            const ctx = canvas.getContext('2d');
            const W = state.sceneW, H = state.sceneH;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            // Мягкое жёлто-зелёное свечение (рисуется один раз)
            const sprite = document.createElement('canvas');
            sprite.width = sprite.height = 64;
            const sc = sprite.getContext('2d');
            const g = sc.createRadialGradient(32, 32, 0, 32, 32, 32);
            g.addColorStop(0, 'rgba(250, 255, 200, 1)');
            g.addColorStop(0.12, 'rgba(225, 255, 130, 0.9)');
            g.addColorStop(0.35, 'rgba(180, 240, 80, 0.3)');
            g.addColorStop(1, 'rgba(150, 220, 60, 0)');
            sc.fillStyle = g;
            sc.fillRect(0, 0, 64, 64);

            const A = FIREFLY_AREA;
            const rand = (a, b) => a + Math.random() * (b - a);
            const flies = Array.from({ length: FIREFLY_COUNT }, () => ({
                x: rand(A.left, A.right),
                y: rand(A.top, A.bottom),
                a: rand(0, Math.PI * 2),     // направление полёта
                speed: rand(10, 22),
                period: rand(2.5, 6),        // как часто вспыхивает, с
                phase: rand(0, 6),
                bob: rand(0, Math.PI * 2),
                size: rand(9, 14),
                glow: 0,                     // текущая яркость 0..1
                hideUntil: 0,                // погас от фонарика до этого момента
            }));

            let darkFor = 0;
            let presence = 0;
            let drawn = false;
            let last = performance.now();

            const frame = (now) => {
                requestAnimationFrame(frame);
                const dt = Math.min((now - last) / 1000, 0.05);
                last = now;
                const t = now / 1000;

                // Появляются, когда глаза привыкнут к темноте
                if (state.isLightOn) darkFor = 0; else darkFor += dt * 1000;
                const want = darkFor > FIREFLY_APPEAR_MS ? 1 : 0;
                presence += (want - presence) * Math.min(1, dt * (want ? 0.6 : 6));

                if (drawn) { ctx.clearRect(0, 0, W, H); drawn = false; }
                if (presence < 0.01) return;

                const beamOn = FLASHLIGHT_ENABLED && !state.isLightOn && state.flashPointerInside;
                const b = state.flashBeam;
                ctx.globalCompositeOperation = 'lighter';

                for (const f of flies) {
                    // Попал в луч — гаснет и улетает от света
                    if (beamOn) {
                        const dx = f.x - b.x, dy = f.y - b.y;
                        if (Math.hypot(dx, dy) < b.r * 0.85) {
                            if (now >= f.hideUntil) f.a = Math.atan2(dy, dx) + rand(-0.4, 0.4);
                            f.hideUntil = now + rand(2500, 5000);
                        }
                    }
                    const hidden = now < f.hideUntil;

                    // Медленно блуждает; у границы зоны разворачивается к центру
                    f.a += rand(-1, 1) * dt * 2.2;
                    const out = f.x < A.left || f.x > A.right || f.y < A.top || f.y > A.bottom;
                    if (out) {
                        const toC = Math.atan2((A.top + A.bottom) / 2 - f.y, (A.left + A.right) / 2 - f.x);
                        let d = toC - f.a;
                        d = Math.atan2(Math.sin(d), Math.cos(d));
                        f.a += d * Math.min(1, dt * 2);
                    }
                    const sp = f.speed * (hidden ? 2.5 : 1); // испуганный летит быстрее
                    f.x += Math.cos(f.a) * sp * dt;
                    f.y += Math.sin(f.a) * sp * dt + Math.sin(t * 1.3 + f.bob) * 6 * dt;

                    // Слабое свечение + короткие вспышки
                    const local = ((t + f.phase) % f.period) / f.period;
                    const flash = local < 0.14 ? Math.sin(Math.PI * local / 0.14) : 0;
                    const target = hidden ? 0 : 0.15 + 0.85 * flash;
                    f.glow += (target - f.glow) * Math.min(1, dt * (hidden ? 14 : 8));

                    const k = f.glow * presence * FIREFLY_BRIGHTNESS;
                    if (k < 0.01) continue;
                    const s = f.size * (0.7 + 0.3 * f.glow);
                    ctx.globalAlpha = Math.min(1, k);
                    ctx.drawImage(sprite, f.x - s, f.y - s, s * 2, s * 2);
                }
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1;
                drawn = true;
            };
            requestAnimationFrame(frame);
        }

        // ========== СЛЕДЫ ЛАП ==========
        // Лапы кошки-тени: точка крепления hx, сдвиг фазы шага (offW — шагом,
        // offR — галопом), ближняя ли, передняя ли. Шагом кошка переставляет
        // лапы по кругу: левая задняя → левая передняя → правая задняя → правая
        // передняя (через четверть цикла). Галопом задние приземляются почти
        // вместе, передние — тоже, со сдвигом на полцикла.
        const PAW_LEGS = [
            { hx: 13,  offW: Math.PI / 2,   offR: Math.PI * 1.2, near: false, front: true },
            { hx: -16, offW: Math.PI,       offR: Math.PI * 0.2, near: false, front: false },
            { hx: 15,  offW: Math.PI * 1.5, offR: Math.PI,       near: true,  front: true },
            { hx: -14, offW: 0,             offR: 0,             near: true,  front: false },
        ];
        const catLegOff = (l, run) => l.offW + (l.offR - l.offW) * run;

        // Положение лапы в цикле шага относительно плеча/бедра. На опоре
        // (доля duty) лапа равномерно уходит назад — с той же скоростью, с какой
        // идёт кошка, поэтому не скользит; в переносе — плавно выносится вперёд
        // и приподнимается. swing: -1 на опоре, иначе 0..1 — ход переноса.
        function catFoot(phase, off, stride, duty) {
            let u = ((phase + off) / (Math.PI * 2)) % 1;
            if (u < 0) u += 1;
            if (u < duty) return { x: stride * (1 - 2 * u / duty), lift: 0, swing: -1 };
            const k = (u - duty) / (1 - duty);
            return { x: stride * -Math.cos(Math.PI * k), lift: Math.sin(Math.PI * k), swing: k };
        }
        // Скорость фазы, при которой лапа на опоре проходит 2·stride за время опоры
        const catPhaseRate = (w) => w.speed * w.duty * Math.PI / w.stride;

        function setupPawPrints() {
            const canvas = document.getElementById('pawPrints');
            if (!canvas || !canvas.getContext) return;
            if (!PAW_PRINTS_ENABLED || !CAT_SHADOW_ENABLED) { canvas.remove(); return; }
            const ctx = canvas.getContext('2d');
            const W = state.sceneW, H = state.sceneH;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const P = CAT_SHADOW_PATH;
            const prints = [];
            state.addPawPrint = (x, y, dir) => {
                if (x < P.leftX || x > P.rightX) return;
                prints.push({ x, y, dir, born: performance.now(), rot: (Math.random() - 0.5) * 0.3 });
                if (prints.length > 300) prints.shift();
            };

            // След в перспективе: сплющен по вертикали; подушечка + 3 пальца
            // впереди по направлению шага
            const drawPrint = (p) => {
                const s = PAW_PRINT_SIZE * P.scale;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.scale(p.dir * s, s * 0.45);
                ctx.rotate(p.rot);
                ctx.beginPath();
                ctx.ellipse(0, 0, 2.2, 2, 0, 0, Math.PI * 2);
                ctx.moveTo(3.6, -2.2); ctx.arc(2.9, -2.2, 0.75, 0, Math.PI * 2);
                ctx.moveTo(4.2, 0);    ctx.arc(3.5, 0, 0.75, 0, Math.PI * 2);
                ctx.moveTo(3.6, 2.2);  ctx.arc(2.9, 2.2, 0.75, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            };

            let drawn = false;
            const frame = (now) => {
                requestAnimationFrame(frame);
                while (prints.length && now - prints[0].born > PAW_PRINT_FADE_MS) prints.shift();
                if (drawn) { ctx.clearRect(0, 0, W, H); drawn = false; }
                if (!prints.length) return;

                const light = roomLightLevel();
                const beamOn = FLASHLIGHT_ENABLED && !state.isLightOn && state.flashPointerInside;
                if (light < 0.01 && !beamOn) return;
                const b = state.flashBeam;

                // Не поверх настоящей кошки на переднем плане
                ctx.save();
                ctx.beginPath();
                ctx.rect(0, 0, W, H);
                CAT_SHADOW_HIDE.forEach(poly => {
                    ctx.moveTo(poly[0][0], poly[0][1]);
                    for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i][0], poly[i][1]);
                    ctx.closePath();
                });
                ctx.clip('evenodd');
                ctx.fillStyle = 'rgb(28, 18, 8)'; // пыль стёрта — проступает тёмный пол

                for (const p of prints) {
                    let vis = light;
                    if (beamOn) {
                        const d = Math.hypot(p.x - b.x, p.y - b.y) / b.r;
                        if (d < 1) vis = Math.max(vis, 1 - d * d);
                    }
                    if (vis <= 0.01) continue;
                    const age = (now - p.born) / PAW_PRINT_FADE_MS;
                    const fade = 1 - age * age; // долго держится, потом быстро тает
                    ctx.globalAlpha = PAW_PRINT_OPACITY * fade * vis;
                    drawPrint(p);
                }
                ctx.restore();
                ctx.globalAlpha = 1;
                drawn = true;
            };
            requestAnimationFrame(frame);
        }

        // ========== МОТЫЛЁК ==========
        // Движение — «пружина» к цели + случайный ветер, поэтому траектория
        // петляет. Цель: точка на орбите вокруг лампочки (или луча фонарика),
        // либо точка за краем сцены, когда мотылёк улетает.
        function setupMoth() {
            const canvas = document.getElementById('moth');
            if (!canvas || !canvas.getContext) return;
            if (!MOTH_ENABLED) { canvas.remove(); return; }
            const ctx = canvas.getContext('2d');
            const W = state.sceneW, H = state.sceneH;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const rand = (a, b) => a + Math.random() * (b - a);
            const randIn = ([a, b]) => rand(a, b);
            const bulb = { x: LAMP_BEAM.x, y: LAMP_BEAM.y - 12 };
            const MAX_SPEED = 300;

            const m = {
                mode: 'away',      // away | lamp | beam | leave
                x: -50, y: -50, vx: 0, vy: 0,
                heading: 0,
                flap: 0,
                theta: rand(0, Math.PI * 2), // угол на орбите
                orbitDir: 1,
                R: 45,
                wander: rand(0, Math.PI * 2),
                exit: { x: 0, y: 0 },
                nextOrbitChange: 0,
                nextBump: 0,
                bumpUntil: 0,
            };

            let start = performance.now();
            let wasOn = state.isLightOn;
            let returnAt = start + randIn(MOTH_RETURN_DELAY);
            let beamAt = Infinity, beamUntil = Infinity;
            const scheduleBeam = (now) => {
                beamAt = Math.random() < MOTH_BEAM_CHANCE ? now + randIn(MOTH_BEAM_DELAY) : Infinity;
                beamUntil = Infinity;
            };
            if (!wasOn) scheduleBeam(start);

            // Влетает из-за верхнего или бокового края
            const spawn = () => {
                const side = Math.random();
                if (side < 0.5) { m.x = rand(W * 0.15, W * 0.85); m.y = -20; }
                else if (side < 0.75) { m.x = -20; m.y = rand(0, H * 0.6); }
                else { m.x = W + 20; m.y = rand(0, H * 0.6); }
                const a = Math.atan2(H * 0.4 - m.y, W / 2 - m.x);
                m.vx = Math.cos(a) * 150;
                m.vy = Math.sin(a) * 150;
                m.heading = a;
            };
            // Улетает примерно туда, куда летел
            const startLeaving = () => {
                m.mode = 'leave';
                const a = Math.atan2(m.vy, m.vx) + rand(-0.6, 0.6);
                m.exit = { x: m.x + Math.cos(a) * 2000, y: m.y + Math.sin(a) * 2000 };
            };

            // Мотылёк в локальных координатах «головой вверх»
            const drawMoth = (x, y, heading, open, scale, colors) => {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(heading + Math.PI / 2);
                ctx.scale(scale, scale);
                for (const s of [-1, 1]) {
                    // переднее крыло
                    ctx.fillStyle = colors.fore;
                    ctx.beginPath();
                    ctx.moveTo(0, -1.5);
                    ctx.quadraticCurveTo(s * 7 * open, -5, s * 8.5 * open, 1);
                    ctx.quadraticCurveTo(s * 4 * open, 2.5, 0, 1.5);
                    ctx.fill();
                    // заднее крыло
                    ctx.fillStyle = colors.hind;
                    ctx.beginPath();
                    ctx.moveTo(0, 0.5);
                    ctx.quadraticCurveTo(s * 5.5 * open, 1.5, s * 4.5 * open, 5);
                    ctx.quadraticCurveTo(s * 2 * open, 5.5, 0, 3.5);
                    ctx.fill();
                }
                // тельце и усики
                ctx.fillStyle = colors.body;
                ctx.beginPath();
                ctx.ellipse(0, 1, 1.1, 3.8, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = colors.body;
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(-0.4, -2.5); ctx.quadraticCurveTo(-1.5, -4.5, -2.5, -5);
                ctx.moveTo(0.4, -2.5);  ctx.quadraticCurveTo(1.5, -4.5, 2.5, -5);
                ctx.stroke();
                ctx.restore();
            };
            const MOTH_COLORS = { fore: '#e2d1ab', hind: '#c9b38a', body: '#6e5940' };
            const SHADOW_COLORS = { fore: '#140d05', hind: '#140d05', body: '#140d05' };

            let last = start;
            const frame = (now) => {
                requestAnimationFrame(frame);
                const dt = Math.min((now - last) / 1000, 0.05);
                last = now;
                if (dt <= 0) return;

                // Реакция на выключатель
                if (state.isLightOn !== wasOn) {
                    wasOn = state.isLightOn;
                    if (wasOn) returnAt = now + randIn(MOTH_RETURN_DELAY);
                    else scheduleBeam(now);
                }
                const light = roomLightLevel();
                const beamOn = FLASHLIGHT_ENABLED && !state.isLightOn && state.flashPointerInside;

                // Чего мотылёк хочет сейчас
                let want = 'leave';
                if (state.isLightOn && now >= returnAt) want = 'lamp';
                else if (beamOn && now >= beamAt && now < beamUntil) want = 'beam';

                if (want !== 'leave') {
                    if (m.mode === 'away') spawn();
                    if (want === 'beam' && m.mode !== 'beam') beamUntil = now + randIn(MOTH_BEAM_STAY);
                    m.mode = want;
                } else if (m.mode === 'lamp' || m.mode === 'beam') {
                    // Наскучил фонарик — следующий интерес не раньше чем через 20–40 с
                    if (m.mode === 'beam' && now >= beamUntil) {
                        beamAt = Math.random() < MOTH_BEAM_CHANCE ? now + rand(20000, 40000) : Infinity;
                    }
                    startLeaving();
                }

                ctx.clearRect(0, 0, W, H);
                if (m.mode === 'away') return;

                // Цель и сила притяжения к ней
                let tx, ty, K = 10, D = 2.4;
                if (m.mode === 'lamp' || m.mode === 'beam') {
                    const c = m.mode === 'lamp' ? bulb : state.flashBeam;
                    if (now >= m.nextOrbitChange) {
                        if (Math.random() < 0.4) m.orbitDir *= -1;
                        m.R = m.mode === 'lamp' ? rand(22, 70) : rand(18, 50);
                        m.nextOrbitChange = now + rand(700, 2200);
                    }
                    m.theta += m.orbitDir * dt * (m.mode === 'lamp' ? 3.2 : 2.2);
                    tx = c.x + Math.cos(m.theta) * m.R;
                    ty = c.y + Math.sin(m.theta) * m.R * 0.6 + (m.mode === 'lamp' ? 14 : 0);

                    // Время от времени бросается прямо на лампочку и отскакивает
                    if (m.mode === 'lamp') {
                        if (!m.nextBump) m.nextBump = now + rand(2000, 5000);
                        if (now >= m.nextBump && !m.bumpUntil) m.bumpUntil = now + 350;
                        if (m.bumpUntil) {
                            tx = bulb.x; ty = bulb.y; K = 28;
                            if (now >= m.bumpUntil || Math.hypot(m.x - bulb.x, m.y - bulb.y) < 8) {
                                const a = Math.atan2(m.y - bulb.y, m.x - bulb.x) + rand(-0.5, 0.5);
                                m.vx = Math.cos(a) * 220;
                                m.vy = Math.sin(a) * 220;
                                m.bumpUntil = 0;
                                m.nextBump = now + rand(2000, 5000);
                            }
                        }
                    } else {
                        m.bumpUntil = 0; m.nextBump = 0;
                    }
                } else { // leave
                    tx = m.exit.x; ty = m.exit.y; K = 0.6; D = 0.8;
                }

                // Пружина к цели + блуждающий «ветер»
                m.wander += rand(-1, 1) * dt * 14;
                const noise = m.mode === 'leave' ? 250 : 520;
                let ax = (tx - m.x) * K - m.vx * D + Math.cos(m.wander) * noise;
                let ay = (ty - m.y) * K - m.vy * D + Math.sin(m.wander) * noise;
                m.vx += ax * dt;
                m.vy += ay * dt;
                const sp = Math.hypot(m.vx, m.vy);
                if (sp > MAX_SPEED) { m.vx *= MAX_SPEED / sp; m.vy *= MAX_SPEED / sp; }
                m.x += m.vx * dt;
                m.y += m.vy * dt;

                if (m.mode === 'leave' &&
                    (m.x < -40 || m.x > W + 40 || m.y < -40 || m.y > H + 40)) {
                    m.mode = 'away';
                    return;
                }

                // Поворот по направлению полёта (плавно)
                if (sp > 10) {
                    let d = Math.atan2(m.vy, m.vx) - m.heading;
                    d = Math.atan2(Math.sin(d), Math.cos(d));
                    m.heading += d * Math.min(1, dt * 10);
                }
                m.flap += dt * Math.PI * 2 * (13 + sp * 0.02);
                const open = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(m.flap));

                // Видимость: свет лампы или луч фонарика
                let vis = light;
                if (beamOn) {
                    const b = state.flashBeam;
                    const d = Math.hypot(m.x - b.x, m.y - b.y) / b.r;
                    if (d < 1) vis = Math.max(vis, 1 - d * d);
                }
                if (vis <= 0.01) return;

                // Тень на стене: отбрасывается от лампочки, крупнее и размытая
                if (MOTH_SHADOW > 0 && light > 0.05) {
                    const sx = m.x + (m.x - bulb.x) * 0.6;
                    const sy = m.y + (m.y - bulb.y) * 0.6 + 6;
                    ctx.globalAlpha = MOTH_SHADOW * light;
                    ctx.filter = 'blur(2px)';
                    drawMoth(sx, sy, m.heading, open, MOTH_SCALE * 1.8, SHADOW_COLORS);
                    ctx.filter = 'none';
                }
                ctx.globalAlpha = Math.min(1, 0.95 * vis);
                drawMoth(m.x, m.y, m.heading, open, MOTH_SCALE, MOTH_COLORS);
                ctx.globalAlpha = 1;
            };
            requestAnimationFrame(frame);
        }

        // ========== ВИНЬЕТКА ==========
        function updateVignette() {
            const v = document.getElementById('vignette');
            if (!v) return;
            v.style.opacity = String(state.isLightOn ? VIGNETTE_LIT : VIGNETTE_DARK);
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('pullCord').addEventListener('click', toggleLight);
        });

        initialize();
    </script>
</body>
</html>
